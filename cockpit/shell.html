<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>期货组合驾驶舱</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F3F0; --surface:#FFFFFF; --sunk:#EAECE8;
  --ink:#0F1A1E; --ink2:#44565C; --ink3:#788A90; --line:#D9DEDB; --line2:#E8ECE9;
  --focus:#B3841A; --focusS:rgba(179,132,26,.13);
  --bull:#D03A33; --bear:#13915B; --bullS:rgba(208,58,51,.075); --bullM:rgba(208,58,51,.15); --bearS:rgba(19,145,91,.075); --bearM:rgba(19,145,91,.15);
  --amber:#D6A01B; --shadow:0 10px 32px rgba(15,26,30,.16);
  --font:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif; --num:"Archivo","Noto Sans SC","PingFang SC",system-ui,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px);
}
:root[data-theme="night"]{
  --bg:#080E11; --surface:#0E171B; --sunk:#0B1316;
  --ink:#E9F0EF; --ink2:#A4B6BA; --ink3:#6C8085; --line:#1C2A2F; --line2:#152228;
  --focus:#E8B84E; --focusS:rgba(232,184,78,.15);
  --bull:#FF6B63; --bear:#3ACB93; --bullS:rgba(255,107,99,.09); --bullM:rgba(255,107,99,.19); --bearS:rgba(58,203,147,.085); --bearM:rgba(58,203,147,.18);
  --amber:#EBBB4A; --shadow:0 10px 32px rgba(0,0,0,.55);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:400 14px/1.5 var(--font);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}
.bull{color:var(--bull)} .bear{color:var(--bear)} .dim{color:var(--ink3)} .dim2{color:var(--ink2)}

/* ===== 外壳：整页就是一块仪表盘面板 ===== */
.app{display:flex;flex-direction:column;min-height:100dvh;background:var(--surface)}
.bar{display:flex;align-items:center;gap:14px;height:52px;padding:0 20px;border-bottom:1px solid var(--line);flex:none;position:relative;z-index:6;background:var(--surface)}
.brand{font-weight:700;font-size:15px;letter-spacing:.06em}
.contract{display:flex;align-items:baseline;gap:7px;padding:6px 10px;margin-left:-6px;border-radius:4px}
.contract:hover{background:var(--focusS)}
.contract b{font-family:var(--num);font-size:17px;font-weight:700}
.contract .nm{font-size:13px;color:var(--ink2)} .contract .md{font-size:12px;color:var(--focus);font-weight:500}
.contract .cr{width:7px;height:7px;border-right:1.5px solid var(--ink3);border-bottom:1.5px solid var(--ink3);transform:translateY(-2px) rotate(45deg)}
.sess{display:flex;align-items:center;gap:7px;font-size:13px;padding:4px 10px;border-radius:99px;background:var(--focusS);color:var(--ink);font-weight:500;white-space:nowrap}
.sess i{width:7px;height:7px;border-radius:50%;background:var(--focus)}
.sess.open i{background:var(--bear)}
.sess span{color:var(--ink2);font-weight:400}
.right{margin-left:auto;display:flex;align-items:center;gap:6px}
.sync{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink2);margin-right:6px;white-space:nowrap}
.sync i{width:7px;height:7px;border-radius:50%;border:1.5px solid var(--ink3)}
.sync.note i{background:var(--amber);border-color:var(--amber)}
.tb{padding:6px 11px;border-radius:4px;font-size:13px;color:var(--ink2);white-space:nowrap}
.tb:hover{background:var(--focusS);color:var(--ink)}
.tb[aria-pressed="true"]{background:var(--focusS);color:var(--ink);font-weight:500}
.pop{position:absolute;top:48px;left:14px;min-width:280px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px;box-shadow:var(--shadow);z-index:30;display:none}
.pop.on{display:block}
.pop button{display:grid;grid-template-columns:1fr auto;gap:2px 10px;width:100%;padding:9px 11px;border-radius:4px}
.pop button:hover,.pop button[aria-current="true"]{background:var(--focusS)}
.pop .t{font-weight:500} .pop .s{grid-column:1/-1;font-size:12.5px;color:var(--ink2)} .pop .tag{font-size:12px;color:var(--focus);font-weight:500;align-self:center}
.pop .ft{padding:8px 11px 4px;border-top:1px solid var(--line2);margin-top:4px;font-size:12.5px;color:var(--ink3)}

/* ===== 状态带 ===== */
.band{display:grid;grid-template-columns:1.25fr 1fr 1.15fr;border-bottom:1px solid var(--line);flex:none;min-height:clamp(104px,14.5vh,138px)}
.cell{padding:12px 20px;border-right:1px solid var(--line);min-width:0;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:3px;overflow:hidden}
.cell>*{max-width:100%}
.cell .cl{align-self:stretch}
.cell:last-child{border-right:0}
.cl{font-size:12.5px;color:var(--ink3);display:flex;align-items:center;gap:7px}
.cl .q{margin-left:auto}
.big{font-size:clamp(24px,3.6vh,34px);font-weight:700;line-height:1.2;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.big small{font-size:.5em;font-weight:500;color:var(--ink2);margin-left:8px;letter-spacing:0}
.sub{font-size:13px;color:var(--ink2);line-height:1.45}
.q{width:19px;height:19px;border-radius:50%;border:1px solid var(--line);font-size:11px;line-height:17px;text-align:center;color:var(--ink3);flex:none}
.q:hover{border-color:var(--focus);color:var(--focus)}
.mark{width:4px;align-self:stretch;border-radius:2px;background:var(--line);flex:none}
.px{display:flex;align-items:baseline;gap:10px}
.px .p{font-family:var(--num);font-size:clamp(26px,4vh,38px);font-weight:700;line-height:1}
.px .c{font-family:var(--num);font-size:15px;font-weight:600}
.tick{display:none;align-items:baseline;gap:8px;margin-top:3px;font-family:var(--num);font-size:13px;font-weight:600}
.tick .tl{font-family:inherit;font-size:11px;color:var(--ink3);font-weight:500;border:1px solid var(--line);border-radius:3px;padding:0 4px}
.tick .tp{font-size:20px;line-height:1.1}
.tick .dim{font-size:11px;font-weight:400}
@keyframes flu{from{background:var(--bullM)}to{background:transparent}} @keyframes fld{from{background:var(--bearM)}to{background:transparent}}
.tick .tp.flu{animation:flu .9s ease-out} .tick .tp.fld{animation:fld .9s ease-out}
.seq{display:flex;gap:4px;margin-top:2px;align-items:center}
.seq i{width:30px;height:17px;border-radius:2px;background:var(--line2);flex:none;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:11px;font-weight:600;color:var(--ink2);line-height:1}
.seq i.sb{background:var(--bull);color:#fff} .seq i.sx{background:var(--bear);color:#fff} .seq i.wb{background:var(--bullM);color:var(--bull)} .seq i.wx{background:var(--bearM);color:var(--bear)}
.seq i.na{background:repeating-linear-gradient(135deg,var(--line2) 0 3px,transparent 3px 6px)}
.seq span{font-size:12.5px;color:var(--ink2);margin-left:6px;white-space:nowrap}
.fund{display:flex;align-items:center;gap:12px}
.fund svg.sp{width:92px;height:34px;flex:none;overflow:visible}


/* ===== 交易信号条（首页） ===== */
.sigbar{display:grid;grid-template-columns:1.55fr 1fr;border-bottom:1px solid var(--line);flex:none}
.sg{display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:9px 20px;text-align:left;border-right:1px solid var(--line);min-width:0}
.sg:last-child{border-right:0}
.sg:hover{background:var(--focusS)}
.sg .cl{font-size:12px;color:var(--ink3)}
.sg .hd{font-size:19px;font-weight:600;line-height:1.25}
.sg .sb{font-size:12.5px;color:var(--ink2);line-height:1.4}
.sg.long .hd{color:var(--bull)} .sg.short .hd{color:var(--bear)} .sg.wait .hd{color:var(--ink2)}
.sg.pos.exit{background:color-mix(in srgb,var(--amber) 16%,transparent);box-shadow:inset 4px 0 0 var(--amber)}
.sg.pos.exit .hd{color:var(--amber)}
.sg.pos.hold{background:var(--bearS);box-shadow:inset 4px 0 0 var(--bear)}.sg.pos.hold .hd{color:var(--bear)}
.scs{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;margin-top:2px}
.sc{font-size:12px;padding:1px 8px;border-radius:10px;border:1px solid var(--line);color:var(--ink3);white-space:nowrap}
.sc.y{color:var(--bear);border-color:color-mix(in srgb,var(--bear) 55%,transparent);background:var(--bearS)} .sc.n{color:var(--amber);border-color:color-mix(in srgb,var(--amber) 60%,transparent);background:color-mix(in srgb,var(--amber) 10%,transparent)} .sc.sep{border:0;padding:0 2px;color:var(--ink3)}
.vd{padding:8px 12px;border-radius:6px;border:1px solid var(--line)}
.vd.exit{border-color:var(--amber);background:color-mix(in srgb,var(--amber) 14%,transparent)}
.pbtn{margin:6px 0 4px;padding:7px 16px;border:1px solid var(--ink3);border-radius:4px;background:var(--sunk);color:var(--ink);font:inherit;cursor:pointer}
.pbtn:hover{background:var(--focusS)} .pbtn.warn{border-color:var(--amber);font-weight:600}
.xbtn{padding:0 8px;color:var(--ink3);font-size:16px;line-height:1.2} .xbtn:hover{color:var(--bear)}
.lnk{color:var(--focus);text-decoration:underline;cursor:pointer;background:none;border:0;padding:0;font:inherit}
.pmsg{border:1px solid var(--amber);border-radius:4px;padding:6px 10px}
#planBody details{margin:10px 0 0;border-top:1px solid var(--line2);padding-top:8px} #planBody summary{cursor:pointer;color:var(--ink2);font-size:13px}


/* ===== 交易 / 研究 模式 ===== */
.modes{margin-left:12px;flex:none}
.tradepane{display:none;flex-direction:column;min-width:0;min-height:0;overflow-y:auto;padding:14px 20px 16px}
body.mode-trade .tradepane{display:flex}
body.mode-trade .wall,body.mode-trade .band,body.mode-trade .dock{display:none}
body.mode-research .tradepane{display:none}
.tbmo tr.cur td{background:rgba(80,140,230,.14)}.tbmo .mb{display:inline-block;height:8px;background:var(--ink2);opacity:.45;border-radius:2px;margin-right:6px;vertical-align:middle}
.mk{font-size:11px;margin-left:6px;padding:0 5px;border-radius:8px;background:rgba(128,128,128,.18)}.mk.高发{background:rgba(224,160,40,.28)}.mk.少发{opacity:.7}.stars{color:#d9a21b;letter-spacing:1px}
.dsw{display:inline-flex;align-items:flex-start;gap:6px;margin-top:6px;font-size:12px;line-height:1.4}.dsb{display:inline-flex;align-items:center;gap:4px;cursor:pointer;padding:1px 8px 1px 3px;border-radius:12px;border:1px solid var(--line);color:var(--ink3)}.dsb i{font-style:normal;font-weight:700;width:15px;height:15px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;color:#fff;background:var(--amber)}.dsb u{text-decoration:none;font-size:11.5px}
.dsw.ok .dsb i{background:var(--bear)}.dsw.bad .dsb i{background:var(--bull)}.dsw.bad .dsb{border-color:var(--bull)}.dst{padding:2px 8px;border-radius:6px;background:color-mix(in srgb,var(--amber) 16%,transparent);color:var(--ink)}.dsw.ok .dst{background:var(--bearS)}.dsw.bad .dst{background:var(--bullS);font-weight:600}.dst small{font-weight:400;color:var(--ink3)}.sb2{color:var(--ink3);font-size:12px}@media(max-height:830px){.sb2{display:none}}
.dsl{margin-top:6px;font-size:12px;line-height:1.4;padding:3px 8px;border-radius:6px;display:inline-block}
.dsl.ok{background:rgba(46,160,90,.14);color:var(--ink)}.dsl.part{background:rgba(224,160,40,.18);color:var(--ink)}.dsl.bad{background:rgba(220,60,60,.18);color:var(--ink);font-weight:600}
.sg.gate{background:color-mix(in srgb,var(--amber) 10%,transparent)} .sg.gate .hd{color:var(--amber)}
.scs.dim{opacity:.45}
@media(min-width:900px){.sigbar .hd{font-size:22px}}

/* ===== 检查条 ===== */
.checks{display:flex;align-items:center;gap:2px;height:40px;padding:0 14px;border-bottom:1px solid var(--line);flex:none;overflow-x:auto;scrollbar-width:none}
.checks::-webkit-scrollbar{display:none}
.lp{display:flex;align-items:center;gap:7px;padding:5px 11px;border-radius:4px;white-space:nowrap;font-size:13px}
.lp:hover{background:var(--focusS)}
.lp .k{color:var(--ink3)} .lp .v{font-weight:500}
.lamp{width:15px;height:15px;flex:none}
.lamp circle{fill:none;stroke:var(--ink3);stroke-width:1.5}
.lamp.note circle{fill:var(--amber);stroke:var(--amber)} .lamp.warn circle{fill:var(--amber);stroke:var(--ink);stroke-width:1.7}
.lamp.warn path{stroke:var(--ink);stroke-width:2;stroke-linecap:round;fill:none} .lamp.na circle{stroke-dasharray:2.2 2.2}
.sp1{flex:1;min-width:8px}
.rule{margin-left:auto;font-size:12.5px;color:var(--ink3);padding:5px 10px;border-radius:4px;white-space:nowrap}
.rule:hover{background:var(--focusS);color:var(--ink)}

/* ===== 主体：左图表，右趋势墙 ===== */
.main{display:grid;grid-template-columns:minmax(0,43fr) minmax(0,57fr);flex:1 1 auto;min-height:0}
.chart{border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0;min-height:0;padding:14px 20px 12px;overflow-y:auto}
.ch-h{display:flex;align-items:center;gap:10px;margin-bottom:6px;flex:none}
.ch-h .t{font-weight:600;font-size:14px}
.seg{display:flex;border:1px solid var(--line);border-radius:5px;overflow:hidden}
.seg button{padding:3px 10px;font-size:12.5px;color:var(--ink2);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface);font-weight:500}
.seg button:not([aria-pressed="true"]):hover{background:var(--focusS)}
.seg{flex-shrink:0}.seg button{white-space:nowrap}
.vtabs{display:flex;width:100%;margin:2px 0 8px}.vtabs button{flex:1;padding:7px 2px;font-size:13px;text-align:center}
.ch-r{display:flex;justify-content:flex-end;margin:0 0 6px}
.hl{font-size:14.5px;line-height:1.55;margin:2px 0 10px}.hl b{font-family:var(--num);font-size:16px}
.mbars{position:relative;display:flex;gap:3px;margin:6px 0 4px}
.mc{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:3px 0;border-radius:5px;min-width:0}
.mc.now{background:var(--focusS);outline:1px solid var(--focus)}
.mc .mb{position:relative;width:100%;height:clamp(46px,12vh,110px);display:flex;align-items:flex-end;justify-content:center}.mc .mb i{display:block;width:62%;border-radius:2px 2px 0 0}
.mc .mv{font-size:11px;font-family:var(--num);color:var(--ink2)}.mc .mm{font-size:11px;color:var(--ink2)}.mc .mr{font-size:10.5px;font-family:var(--num)}
.m50{position:absolute;left:0;right:0;top:74px;border-top:1px dashed var(--ink3);pointer-events:none}
.mleg{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:var(--ink3);margin-bottom:8px;flex-wrap:wrap}
.ruler{position:relative;margin:4px 0}.ruler .vline{position:absolute;top:0;bottom:0;width:0;border-left:1.5px dashed var(--ink);z-index:1;pointer-events:none}
.cr{padding:6px 0}.cl2{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink2);margin-bottom:4px;gap:8px}.cl2 b{color:var(--ink);font-family:var(--num);font-weight:600}
.ct{position:relative;height:16px;background:var(--sunk);border-radius:8px}
.ct .dot{position:absolute;top:2px;width:12px;height:12px;border-radius:50%;transform:translateX(-6px)}
.ct .bandx{position:absolute;top:3px;height:10px;border-radius:5px;opacity:.75}

.ptr{display:flex;flex-direction:column;gap:3px;flex:none;margin:2px 0 8px}
.pr2{display:grid;grid-template-columns:2.6em repeat(3,max-content);gap:4px 22px;align-items:baseline;font-size:13px}
.pr2 .pnm{color:var(--ink3);font-size:12.5px}
.pc{display:flex;gap:6px;align-items:baseline;white-space:nowrap;min-width:0}
.pc i{font-style:normal;font-size:11.5px;color:var(--ink3)} .pc b{font-family:var(--num);font-size:15px;font-weight:700} .pc.na b{color:var(--ink3);font-weight:400}
.kl{position:relative;flex:1 1 auto;min-height:110px}
.kl svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.kl .tip{position:absolute;left:0;top:0;font-family:var(--num);font-size:12px;color:var(--ink2);background:var(--surface);padding:1px 6px;pointer-events:none;border-radius:3px}
.kl .lv,.kl .lw{font-size:11px;fill:var(--ink2);font-family:var(--num)}
.rng{flex:none;margin-top:8px}
.rng .l1{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink2);margin-bottom:5px}
.rng .l1 b{color:var(--ink);font-weight:600}
.rtrack{position:relative;height:8px;border-radius:4px;background:linear-gradient(90deg,var(--bearM),var(--sunk) 35%,var(--sunk) 65%,var(--bullM))}
.rtrack i{position:absolute;top:-4px;width:4px;height:16px;border-radius:2px;background:var(--ink);transform:translateX(-2px)}
.rng .l2{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink3);margin-top:4px}
.ctr{display:grid;grid-template-columns:1fr 1fr;gap:3px 14px;flex:none;margin-top:8px;font-size:12.5px;color:var(--ink2)}
.ctr .r{display:flex;gap:10px;flex-wrap:nowrap;white-space:nowrap;overflow:hidden}
.ctr b{font-family:var(--num);font-weight:600;color:var(--ink);margin-left:4px}

.wall{display:flex;flex-direction:column;min-width:0;min-height:0}
.wh{display:flex;align-items:center;gap:12px;height:44px;padding:0 20px;border-bottom:1px solid var(--line2);flex:none}
.wh .t{font-weight:600;font-size:14px}
.wh .hint{font-size:12.5px;color:var(--ink3);margin-left:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tiles{flex:1 1 auto;min-height:0;display:grid;background:var(--line2);gap:1px;border-bottom:0}
.tile{container-type:inline-size;position:relative;background:var(--surface);padding:10px 12px 8px 16px;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(22px,1fr) auto;gap:2px;min-width:0;min-height:0;overflow:hidden;text-align:left}
.tile:hover{background:var(--sunk)}
.tile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--line)}
.tile.sb::before{background:var(--bull)} .tile.sx::before{background:var(--bear)}
.tile.tb2{background:linear-gradient(var(--bullS),var(--bullS)),var(--surface)} .tile.tx2{background:linear-gradient(var(--bearS),var(--bearS)),var(--surface)}
.tile.tb3{background:linear-gradient(var(--bullM),var(--bullM)),var(--surface)} .tile.tx3{background:linear-gradient(var(--bearM),var(--bearM)),var(--surface)}
.tile:hover.tb2,.tile:hover.tb3,.tile:hover.tx2,.tile:hover.tx3{filter:brightness(.97)}
.t1{display:flex;align-items:center;gap:6px;min-height:20px}
.t1 .n{font-size:13px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1 1 auto;min-width:0}
.t1 .bd{flex:none;font-size:11px;font-weight:500;padding:0 5px;border-radius:3px;white-space:nowrap;line-height:17px}
.t1 .n{flex:1 1 0}
.t2{display:flex;align-items:baseline;gap:4px;white-space:nowrap;overflow:hidden;min-width:0}
.t2 .v{font-family:var(--num);font-size:clamp(19px,2.9vh,26px);font-weight:700;line-height:1.2;flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:clip}
.t2 .u{font-size:12px;color:var(--ink3);flex:none;line-height:1}
.bd.up{background:var(--bullM);color:var(--bull)} .bd.down{background:var(--bearM);color:var(--bear)} .bd.m{background:var(--sunk);color:var(--ink2)}
.sk{min-height:22px;margin:1px -2px;position:relative}
.sk svg{position:absolute;inset:0;width:100%;height:100%;display:block;overflow:visible}
svg .ln{fill:none;stroke-width:1.9;stroke-linejoin:round;stroke-linecap:round}

<body>
<div class="app" id="app">
  <header class="bar">
    <div class="seg vsw" id="vSeg" role="group" aria-label="切换品种"><button data-v="all" aria-pressed="false">总览</button><button data-v="meal" aria-pressed="true">豆粕</button><button data-v="ru" aria-pressed="false" title="橡胶 3月季节性做空">橡胶</button></div>
    <button class="contract" id="cBtn" aria-haspopup="true" aria-expanded="false" aria-label="交易合约，点击查看或手动切换"><b id="cSym">—</b><span class="nm" id="cName"></span><span class="md" id="cMode"></span><i class="cr"></i></button>
    <div class="pop" id="cPop" role="menu"></div>
    <div id="acctPop" class="apop" hidden></div>
    <div class="sess" id="sess"></div>
    <button class="sdot" id="syncDot" type="button"></button>
    <div class="seg modes" id="modeSeg" role="group" aria-label="切换模式"><button data-mode="trade" aria-pressed="true">交易</button><button data-mode="research" aria-pressed="false" title="基本面趋势、市场状态、证据页">研究</button></div>
    <div class="right">
      <div class="sync" id="sync"></div>
      <button class="tb" id="flBtn" aria-pressed="false" title="出入金记录、备份与导出">出入金</button>
      <button class="tb" id="setBtn" aria-pressed="false" title="账户设置、出入金、对账校准、云同步">账户</button>
      <button class="tb" id="planBtn" aria-pressed="false" title="显示/收起交易计划面板（空仓时默认收起，有持仓时默认展开）">计划</button>
      <button class="tb" id="exBtn" aria-pressed="false" title="显示每一块的白话说明（快捷键 E）">解释</button>
      <button class="tb opt" id="thBtn" title="日夜主题：自动按时间切换">主题</button>
      <button class="tb" id="abBtn" title="方法与口径（快捷键 ?）">说明</button>
    </div>
  </header>
  <section class="sigbar" id="sigbar" aria-label="交易信号与持仓"></section>
  <section class="band" id="band" aria-label="背景：市场状态、基本面、资金面"></section>
  <nav class="checks" id="checks" aria-label="交易前检查"></nav>
  <main class="main">
    <section class="chart" id="chart" aria-label="价格与持仓"></section>
    <section class="wall" id="wall" aria-label="趋势墙"></section>
    <section class="tradepane" id="tradePanel" aria-label="交易计划"></section>
  </main>
  <nav class="dock" aria-label="证据">
    <span class="lb">证据</span>
    <button class="tab" data-tab="drivers">驱动<span class="kb">1</span></button>
    <button class="tab" data-tab="supply">供给<span class="kb">2</span></button>
    <button class="tab" data-tab="demand">需求<span class="kb">3</span></button>
    <button class="tab" data-tab="capital">资金<span class="kb">4</span></button>
    <button class="tab" data-tab="data">数据<span class="kb">5</span></button>
    <button class="tab" data-tab="input">录入<span class="kb">6</span></button>
    <span class="note" id="dockNote"></span>
  </nav>
  <section class="ruapp" id="ruApp" aria-label="橡胶3月季节性做空与组合总览"></section>
</div>
