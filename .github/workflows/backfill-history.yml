name: 回填历史数据

# 一次性、手动触发(Actions标签页 → 回填历史数据 → Run workflow)。
# 默认回填四项：美豆库消比(PSD)、美豆出口净销售(ESR)、国内豆粕库消比(Mysteel月度平衡表)、盘面压榨毛利、月差/期限结构(均为新浪日K线，各合约建议交易窗口内的逐日数据)。
# 豆粕周度库存的回填补不全(摘要没数字、2026年6月起正文改版)，不在默认里，改成每小时同步时顺带累积；需要时可 only=meal_stock。
# 跑完会提交 data/history/*.json 和 data/history/_backfill_report.json(每个序列的点数/起止日期/缺失月份/最小最大值)，
# 把报告发给我可以据此校准阈值、并发现解析出错的地方。
on:
  workflow_dispatch:
    inputs:
      only:
        description: "回填哪几项(逗号分隔：us_stu,esr,meal_stu,margin,spread,feed_days,soy_import,arrival,crush_rate,hog_ratio,rm_spread,poultry_ndrc,spot_basis,capital_rank,calibrate；默认all=这11项(不含poultry_ndrc、spot_basis、capital_rank和calibrate)：us_stu,esr,meal_stu,margin,spread,feed_days,soy_import,arrival,crush_rate,hog_ratio,rm_spread；margin=盘面压榨毛利；spread=月差/期限结构；feed_days=饲料企业豆粕库存天数；soy_import=海关大豆月度进口量(多篇交叉验证)；arrival=大豆到港预报(2024-02~2026-06)；crush_rate=油厂开机率(日频，快讯只保留到2024-12；只补历史里缺的交易日，窗口先探一页、封顶就对半切；有40分钟时间预算，超时就停并报告还缺哪些天，再点一次接着补；v98/v99的开机率规则要用)；hog_ratio=猪粮比(数据源本来就带完整历史，不搜索，几秒完成；重试5次/超时30秒；线上每小时的抓取成功一次也会补齐，不一定要手动点)；rm_spread=豆菜粕价差(2024-01~今，约210个点；城市单值≥2个取平均，否则区间中点；评分仍关闭，只用于趋势)；poultry_ndrc=肉鸡养殖预期盈利(★不在默认all里，需要时单独 only=poultry_ndrc。不用Mysteel了：用国家发改委价格监测中心×卓创资讯《猪料、鸡料、蛋料比价》周报，周频(每周三监测)，取公布的'未来肉鸡养殖预期盈利'(亏损写成预期亏损X元/只，会转成负值)。沿栏目列表页的'下一页'链接翻页，每篇取详情页解析；找不到'下一页'链接就不猜分页参数、只处理已拿到的，报告里的 listPages/noNextPageLink/articlesSeen 告诉我真实的分页结构；与Mysteel的白羽肉鸡养殖利润不是同一个定义)；spot_basis=现货基差(★不在默认all里，需要时单独 only=spot_basis。不用Mysteel了：用 AKShare 的 futures_spot_price 取生意社豆粕现货价和主力合约结算价，**基差=现货价-主力合约结算价，自己算**。每个交易日一次网页请求(约700个)，从最新开始、休市日不请求、已有历史的日期跳过，所以可以重复点直到报告里 remaining=0；40分钟时间预算，连续8天拿不到就判断被限流并停手，已拿到的会保存。sp 的口径文档没写明(疑为多地综合基准价)；主力合约换月处基差有断层，报告里的 contractRolls 标出换月点)；capital_rank=龙虎榜历史回填(★不在默认all里，需要时单独 only=capital_rank。不联网：读仓库里 data/raw/dce_rank/ 下的大商所日成交持仓排名文件(M2701_YYYYMMDD.txt)，补高盛/摩根大通/瑞银/中粮/国投的净持仓；线上已有的日期不覆盖，只进一边前20的席位用另一边第20名顶替(下限估计，点上标approx)，几秒完成，可重复点；以后有新文件放进该目录再点一次即可)；calibrate=不联网，只重新生成校准摘要(含榨利/月差的窗口与阈值校准诊断，约7秒)。采样诊断sample与周度库存回填meal_stock已在v99移除。★只点一次(一次填多项)：同一并发组最多1个在跑+1个排队，连点多次会取消中间的)"
        default: "all"
      start:
        description: "Mysteel两项的起始日期"
        default: "2020-01-01"
      no_bodies:
        description: "Mysteel两项不抓文章正文，只用搜索摘要(true/false)；默认false，抓正文才能补全周度库存"
        default: "false"

permissions:
  contents: write

concurrency:
  group: data-writes
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ★榨利/月差回填要用 akshare 拉新浪日K线(fetch_dce_daily_kline)——之前这个工作流没装它，那两项的回填全部失败
      #   ("未安装akshare库")。版本用锁定文件(2026-10-01 在 Actions 里实际装成功的精确版本，含全部间接依赖)，不装"最新版"。
      - name: 语法检查(装依赖之前先做：不需要任何依赖，几秒内失败并指出行号；Python 版本与实际运行一致)
        run: python -m compileall -q -f .

      - name: 安装依赖(akshare，榨利/月差回填用；精确版本见 requirements-akshare.lock.txt)
        run: pip install -r requirements-akshare.lock.txt

      # only=poultry_ndrc(发改委肉鸡预期盈利回填)要用浏览器读文章列表；其余项目不需要。装失败不影响其它项目(continue-on-error)，肉鸡项会在报告里写明原因。
      - name: 安装依赖(selenium，只有 poultry_ndrc 回填用；Chrome 由 ubuntu-latest 自带)
        continue-on-error: true
        run: pip install -r requirements-selenium.lock.txt

      - name: 运行回填脚本(其余几项只用标准库；榨利/月差需要上一步装的akshare)
        env:
          USDA_API_KEY: ${{ secrets.USDA_API_KEY }}
          ONLY: ${{ github.event.inputs.only }}
          START: ${{ github.event.inputs.start }}
          NO_BODIES: ${{ github.event.inputs.no_bodies }}
        run: |
          EXTRA=""
          if [ "$NO_BODIES" = "true" ]; then EXTRA="--no-bodies"; fi
          python3 backfill_history.py --only "$ONLY" --start "$START" $EXTRA

      - name: 提交历史数据
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/history/
          git diff --staged --quiet || git commit -m "回填历史数据 $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
