name: 更新豆粕基本面数据

# 触发条件：
# 豆粕交易时段内每小时跑一次(仓库是公开的，GitHub Actions完全免费不限额度)。
# 时间点都比整点晚5分钟，避开GitHub高峰负载导致的延迟(官方建议不要卡整点)。
#
# 大商所豆粕交易时段(北京时间)：
#   日盘：9:00-10:15、10:30-11:30、13:30-15:00
#   夜盘：21:00-23:00(周日到周四晚上，对应周一到周五的交易日——
#         周日夜盘算的是"周一"这个交易日，所以周日晚上也要跑)
#
# 日盘时段用周一至周五(cron的1-5)，夜盘时段单独用周日至周四(cron的0-4)，
# 两者day-of-week不一样，不能合并成一条cron表达式。
#
# ⚠️GitHub Actions排程最短间隔是5分钟，写"每分钟"技术上会被通过验证但根本
# 不会按这个频率触发(官方文档："The shortest interval you can run scheduled
# workflows is once every 5 minutes.")。这里选每小时一次，一是比5分钟这个下限
# 宽松很多，避免过于频繁请求新浪财经/东方财富这类接口触发反爬风控(大商所官网
# 直连那次BadZipFile就是撞上了类似的风控机制)；二是跟K线本身的最细颗粒度
# (小时线)对得上，查更勤也不会多出新信息，纯粹浪费请求。
on:
  schedule:
    - cron: "5 1 * * 1-5"   # 北京时间09:05(日盘开盘后)，UTC 01:05，周一至周五
    - cron: "5 2 * * 1-5"   # 北京时间10:05，UTC 02:05
    - cron: "5 3 * * 1-5"   # 北京时间11:05(上午盘接近收盘)，UTC 03:05
    - cron: "35 5 * * 1-5"  # 北京时间13:35(下午盘开盘后)，UTC 05:35
    - cron: "35 6 * * 1-5"  # 北京时间14:35，UTC 06:35
    - cron: "5 7 * * 1-5"   # 北京时间15:05(下午盘刚收盘，当天K线基本定型)，UTC 07:05
    - cron: "5 13 * * 0-4"  # 北京时间21:05(夜盘开盘后)，UTC 13:05，周日至周四(周日夜盘=周一交易日)
    - cron: "5 14 * * 0-4"  # 北京时间22:05，UTC 14:05
    - cron: "5 15 * * 0-4"  # 北京时间23:05(夜盘刚收盘)，UTC 15:05——也覆盖持仓排名/USDA出口销售等数据更新
  workflow_dispatch: {}

permissions:
  contents: write  # 需要这个权限才能把抓到的数据提交回仓库
  issues: write    # 交易提醒：在仓库里开 Issue，GitHub 会给你发邮件（v101.31）

# 数据写入类的工作流(每小时同步/历史回填)共用同一个并发组，排队执行，避免两个任务同时push互相冲突
concurrency:
  group: data-writes
  cancel-in-progress: false

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 语法检查(装依赖之前先做：不需要任何依赖，几秒内失败并指出行号；Python 版本与实际运行一致)
        run: python -m compileall -q -f .

      - name: 安装依赖(akshare，用于抓取DCE豆粕期货K线数据、猪粮比(生猪+玉米价格))
        run: pip install -r requirements-akshare.lock.txt      # 精确版本(含全部间接依赖)，不装"最新版"；升级前先手动验证

      - name: 安装依赖(agrobr，用于抓取CONAB巴西大豆播种进度——纯HTTP+XLSX解析，不需要浏览器)
        run: pip install -r requirements-agrobr.lock.txt      # 精确版本；pandas已在akshare那一份里锁定

      # 肉鸡养殖预期盈利(发改委价格监测中心)的文章列表是点击后才加载的，只能用浏览器读：selenium + 运行器自带的 Chrome/chromedriver。
      # continue-on-error：这一步装失败只影响肉鸡这一项(它会显示"不可用"并写明原因)，绝不能拖垮整个数据同步。
      - name: 安装依赖(selenium，读发改委文章列表用；Chrome 由 ubuntu-latest 自带)
        continue-on-error: true
        run: pip install -r requirements-selenium.lock.txt

      # v101.30：每小时顺手取最近 12 天的龙虎榜完整排名（新浪，已有文件不重抓，几秒）。外资5日变化要用「多单/空单」两条腿，线上快照里只有净持仓。
      #   当天的文件要等基线里有当天主力合约（每天 23:05 的累积）后才取得到，所以最新一天的多空明细最晚次日补上；补上之前页面退回净持仓口径并标「估算」。
      - name: 龙虎榜最近几天完整排名(v101.30)
        continue-on-error: true
        run: python3 fetch_seasonal_raw.py --only rank_auto --rank-source sina --rank-start "$(date -u -d '12 days ago' +%F)" --out data/raw/seasonal --budget 300

      - name: 龙虎榜历史自动补齐(v101.19，不联网、幂等、几秒；必须在抓数据之前，抓数据那步要读这些历史算外资趋势)
        run: |
          # 读仓库 data/raw/dce_rank/ 下已有的排名文件补席位净持仓历史；线上已有的日期不覆盖。以后放新文件进去，下一小时自动生效，不用再手动点回填
          python3 backfill_history.py --only capital_rank || echo "龙虎榜自动补齐失败(不影响主数据)"

      - name: 运行数据抓取脚本
        env:
          USDA_API_KEY: ${{ secrets.USDA_API_KEY }}
          NASS_API_KEY: ${{ secrets.NASS_API_KEY }}
        run: python3 fetch_data.py

      # 现货/期货价格每日自动累积(v101.20)：akshare 生意社接口取当天现货价和主力价，追加进 data/raw/seasonal/spot_auto.csv(按日期幂等)，
      #   同时刷新豆粕主连和未到期合约日K，然后重新生成 data/seasonal.json(季节统计 + 近期趋势随之更新)。
      #   只在夜盘收盘后的那一次(UTC 15:05，北京23:05，生意社18:30后已出当天数据)和手动运行时做，免得每小时白跑。
      #   continue-on-error：失败不影响基本面主数据；失败原因看这一步的日志。
      - name: 季节性数据每日累积(现货+期货)
        if: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '5 15 * * 0-4' }}
        continue-on-error: true
        run: |
          python3 fetch_seasonal_raw.py --only spot_daily,refresh,multi --out data/raw/seasonal
          python3 seasonal_stats.py --raw data/raw/seasonal --out data/seasonal.json

      # ★每天记录两个系统的方向(基本面仅供需票、市场结构)——用jsdom无头运行页面自己的评分代码，评分逻辑只有一份。
      #   用来几个月后检验"基本面与市场结构的背离到底有没有信息"。详见 scripts/snapshot_systems.js、record_systems.py。
      #   ⚠️这几步全部 continue-on-error：失败(jsdom装不上、页面出错、联网被限流)绝不能影响上面的数据同步和下面的提交。
      - name: 设置 Node 环境(无头运行页面的评分代码)
        continue-on-error: true
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 安装 jsdom
        continue-on-error: true
        run: npm install --no-save --no-audit --no-fund jsdom@30.1.1

      - name: 记录两个系统的方向(基本面/市场结构)
        continue-on-error: true
        run: |
          node scripts/snapshot_systems.js --html engine.html --latest data/latest.json --out /tmp/systems_snapshot.json
          python3 record_systems.py /tmp/systems_snapshot.json

      # v101.31：换月调整价每次都重算（交易信号和回测同一个口径）。continue-on-error：失败不影响主数据；页面会在数据状态里写「缺换月调整价」。
      - name: 重算换月调整价(data/main_adj.json)
        continue-on-error: true
        run: python3 seasonal_stats.py --raw data/raw/seasonal --out data/seasonal.json

      # v101.31：交易提醒。入场信号 / 持仓该平 / 数据不足 → GitHub Issue(邮件) + 微信(Server酱/PushPlus，配了密钥才发) + 邮件(SMTP，配了才发)。
      #   用页面同一份计算逻辑(scripts/plan_alert.js)；持仓读 data/position.json（Actions →「记录持仓」手动填）；已发的记在 data/alert_state.json 防重复。
      #   全部 continue-on-error：提醒失败绝不能影响数据同步和提交。
      - name: 交易提醒(入场信号/离场/数据不足)
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
        run: |
          node scripts/plan_alert.js --data data --out /tmp/alert.json
          python3 notify_alert.py --alert /tmp/alert.json --state data/alert_state.json

      - name: 提交更新后的数据文件
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/latest.json
          # 历史序列(data/history/)：首次运行前目录可能不存在，所以单独add，失败不影响主数据的提交
          git add data/history/ 2>/dev/null || true
          git add data/main_adj.json data/alert_state.json 2>/dev/null || true
          # 龙虎榜每日原始前20名留档(v101.19)
          git add data/raw/dce_rank_live/ data/raw/dce_rank_auto/ 2>/dev/null || true
          # 现货/期货每日累积文件、刷新后的合约日K、重新生成的季节统计(v101.20)
          git add data/raw/seasonal/ data/seasonal.json 2>/dev/null || true
          # 如果数据没变化就不产生空提交
          git diff --staged --quiet || git commit -m "自动更新豆粕基本面数据 $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true   # 页面记账/15分钟价格任务可能在这期间提交过
          git push
