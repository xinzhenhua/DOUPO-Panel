name: 更新豆粕基本面数据

# 触发条件：
# 豆粕交易时段内每小时跑一次(仓库是公开的，GitHub Actions完全免费不限额度)。
# 时间点都比整点晚5分钟，避开GitHub高峰负载导致的延迟(官方建议不要卡整点)。
#
# 大商所豆粕交易时段(北京时间)：
#   日盘：9:00-10:15、10:30-11:30、13:30-15:00
#   夜盘：21:00-23:00(周日到周四晚上，对应周一到周五的交易日——
#         周日夜盘算的是"周一"这个交易日，所以周日晚上也要跑)
#
# 日盘时段用周一至周五(cron的1-5)，夜盘时段单独用周日至周四(cron的0-4)，
# 两者day-of-week不一样，不能合并成一条cron表达式。
#
# ⚠️GitHub Actions排程最短间隔是5分钟，写"每分钟"技术上会被通过验证但根本
# 不会按这个频率触发(官方文档："The shortest interval you can run scheduled
# workflows is once every 5 minutes.")。这里选每小时一次，一是比5分钟这个下限
# 宽松很多，避免过于频繁请求新浪财经/东方财富这类接口触发反爬风控(大商所官网
# 直连那次BadZipFile就是撞上了类似的风控机制)；二是跟K线本身的最细颗粒度
# (小时线)对得上，查更勤也不会多出新信息，纯粹浪费请求。
on:
  schedule:
    - cron: "5 1 * * 1-5"   # 北京时间09:05(日盘开盘后)，UTC 01:05，周一至周五
    - cron: "5 2 * * 1-5"   # 北京时间10:05，UTC 02:05
    - cron: "5 3 * * 1-5"   # 北京时间11:05(上午盘接近收盘)，UTC 03:05
    - cron: "35 5 * * 1-5"  # 北京时间13:35(下午盘开盘后)，UTC 05:35
    - cron: "35 6 * * 1-5"  # 北京时间14:35，UTC 06:35
    - cron: "5 7 * * 1-5"   # 北京时间15:05(下午盘刚收盘，当天K线基本定型)，UTC 07:05
    - cron: "5 13 * * 0-4"  # 北京时间21:05(夜盘开盘后)，UTC 13:05，周日至周四(周日夜盘=周一交易日)
    - cron: "5 14 * * 0-4"  # 北京时间22:05，UTC 14:05
    - cron: "5 15 * * 0-4"  # 北京时间23:05(夜盘刚收盘)，UTC 15:05——也覆盖持仓排名/USDA出口销售等数据更新
  workflow_dispatch: {}

permissions:
  contents: write  # 需要这个权限才能把抓到的数据提交回仓库

# 数据写入类的工作流(每小时同步/历史回填)共用同一个并发组，排队执行，避免两个任务同时push互相冲突
concurrency:
  group: data-writes
  cancel-in-progress: false

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖(akshare，用于抓取DCE豆粕期货K线数据、猪粮比(生猪+玉米价格))
        run: pip install akshare

      - name: 安装依赖(agrobr，用于抓取CONAB巴西大豆播种进度——纯HTTP+XLSX解析，不需要浏览器)
        run: pip install agrobr pandas

      - name: 运行数据抓取脚本
        env:
          USDA_API_KEY: ${{ secrets.USDA_API_KEY }}
          NASS_API_KEY: ${{ secrets.NASS_API_KEY }}
        run: python3 fetch_data.py

      # ★每天记录两个系统的方向(基本面仅供需票、市场结构)——用jsdom无头运行页面自己的评分代码，评分逻辑只有一份。
      #   用来几个月后检验"基本面与市场结构的背离到底有没有信息"。详见 scripts/snapshot_systems.js、record_systems.py。
      #   ⚠️这几步全部 continue-on-error：失败(jsdom装不上、页面出错、联网被限流)绝不能影响上面的数据同步和下面的提交。
      - name: 设置 Node 环境(无头运行页面的评分代码)
        continue-on-error: true
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 安装 jsdom
        continue-on-error: true
        run: npm install --no-save --no-audit --no-fund jsdom@30.1.1

      - name: 记录两个系统的方向(基本面/市场结构)
        continue-on-error: true
        run: |
          node scripts/snapshot_systems.js --html index.html --latest data/latest.json --out /tmp/systems_snapshot.json
          python3 record_systems.py /tmp/systems_snapshot.json

      - name: 提交更新后的数据文件
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/latest.json
          # 历史序列(data/history/)：首次运行前目录可能不存在，所以单独add，失败不影响主数据的提交
          git add data/history/ 2>/dev/null || true
          # 如果数据没变化就不产生空提交
          git diff --staged --quiet || git commit -m "自动更新豆粕基本面数据 $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
