name: 盘中价格（每15分钟）

# 只抓三个合约的 15 分钟线 → data/prices.json，几秒完成。公开仓库 Actions 免费不限额。
# 北京时间：日盘 09:00–15:00（周一至周五，UTC 01:00–07:00）；夜盘 21:00–23:00（周日至周四，UTC 13:00–15:00）。
# v101.49：改为每5分钟。GitHub 定时任务高峰期会延迟或漏跑（实测 15–30 分钟才来一次），所以页面另外在交易时段每分钟直连新浪15分钟线，不依赖这个任务。
on:
  schedule:
    - cron: "*/5 1-6 * * 1-5"                # 日盘每5分钟（GitHub 的最小间隔；高峰期会延迟/漏跑，页面在交易时段会自己直连新浪补）
    - cron: "*/5 7 * * 1-5"                  # 15:00–15:55 收盘后继续每5分钟：当天收盘价一出来就接上
    - cron: "*/5 13-14 * * 1-5"              # 夜盘 21:00–22:55
    - cron: "*/5 15 * * 1-5"                 # 夜盘 23:00 收盘后
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

# 和其他写数据的任务共用一个队列，避免同时 push 冲突
concurrency:
  group: data-writes
  cancel-in-progress: false

jobs:
  prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-akshare.lock.txt
      - name: 抓15分钟价格
        run: python3 fetch_prices.py
      # v101.42 动态提示：持仓时，止损价/移动止盈线 逼近(≤1%)、盘中触及 → 微信。线按收盘算，盘中价只预警。全部 continue-on-error，不影响价格提交。
      - uses: actions/setup-node@v4
        continue-on-error: true
        with:
          node-version: "22"
      - name: 持仓动态提示（止损线/移动止盈线）
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: |
          pip install -q cryptography || true   # 网页推送加密用
          node scripts/plan_alert.js --data data --out /tmp/alert.json
          python3 notify_alert.py --alert /tmp/alert.json --state data/alert_state.json
      - name: 提交
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/prices.json
          git add data/alert_state.json 2>/dev/null || true
          git add data/push_subs.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "盘中价格 $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push
