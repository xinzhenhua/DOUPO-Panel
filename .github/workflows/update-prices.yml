name: 盘中价格（每15分钟）

# 只抓三个合约的 15 分钟线 → data/prices.json，几秒完成。公开仓库 Actions 免费不限额。
# 北京时间：日盘 09:00–15:00（周一至周五，UTC 01:00–07:00）；夜盘 21:00–23:00（周日至周四，UTC 13:00–15:00）。
# 分钟数错开整点(7/22/37/52)避开 GitHub 高峰；定时任务高峰期可能延迟或漏跑，实际约 15–30 分钟一次。
on:
  schedule:
    - cron: "7,22,37,52 1-6 * * 1-5"
    - cron: "7 7 * * 1-5"
    - cron: "7,22,37,52 13-14 * * 0-4"
    - cron: "7 15 * * 0-4"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

# 和其他写数据的任务共用一个队列，避免同时 push 冲突
concurrency:
  group: data-writes
  cancel-in-progress: false

jobs:
  prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-akshare.lock.txt
      - name: 抓15分钟价格
        run: python3 fetch_prices.py
      # v101.42 动态提示：持仓时，止损价/移动止盈线 逼近(≤1%)、盘中触及 → 微信。线按收盘算，盘中价只预警。全部 continue-on-error，不影响价格提交。
      - uses: actions/setup-node@v4
        continue-on-error: true
        with:
          node-version: "22"
      - name: 持仓动态提示（止损线/移动止盈线）
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
        run: |
          node scripts/plan_alert.js --data data --out /tmp/alert.json
          python3 notify_alert.py --alert /tmp/alert.json --state data/alert_state.json
      - name: 提交
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/prices.json data/alert_state.json 2>/dev/null || git add data/prices.json
          git diff --staged --quiet || git commit -m "盘中价格 $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push
