name: 抓取季节性原始数据

# 一次性、手动触发(Actions标签页 → 抓取季节性原始数据 → Run workflow)。
# 第一次：什么都不用改，直接点绿色 Run workflow(默认 only=main,contracts,cbot,fx)。
#   main=豆粕主连10年日K(含持仓)，contracts=各具体合约日K(约100多个，有40分钟时间预算，没抓完就再点一次，已抓的不重抓)，
#   cbot=CBOT豆粕和大豆10年，fx=美元兑人民币10年。
# 第二次起：想补大商所龙虎榜历史，把 only 改成 dce_rank，并在 rank_list 里填 "月份:合约" 清单，例如 2023-06:m2309,2023-07:m2309,2023-08:m2401
#   (文件存到 data/raw/dce_rank_hist/，不会混进 data/raw/dce_rank/)。
# 跑完会提交 data/raw/seasonal/_fetch_report.json(每一项成功与否、点数、起止日期、失败原因)，并重新生成 data/seasonal.json。
# 现货/主力价10年回补(v101.20)：only 填 spot，akshare 生意社接口逐日抓，从新到旧，有40分钟预算，没补完就再点一次(已补的不重抓)；补完后每天由「更新豆粕基本面数据」那个工作流自动累积。
# 龙虎榜历史自动回填(v101.21)：先 only=rank_probe(几十秒，东方财富和新浪各在 7 个年份试一次，报告哪个来源能回溯到哪一年)；
#   有来源能用，再 only=rank_auto，rank_source 选 em 或 sina，rank_start 默认 2022-01-01(外资 2022 年底才进场)；从新到旧、有40分钟预算，没补完就再点一次(已写的文件不重抓)。
#   文件写到 data/raw/dce_rank_auto/，之后「更新豆粕基本面数据」每小时的 capital_rank 会自动读(同日期手动文件优先)。
# 把 _fetch_report.json 的内容发给我即可。
on:
  workflow_dispatch:
    inputs:
      only:
        description: "抓哪几项(逗号分隔)：main,contracts,cbot,fx,dce_rank,probe,jiangsu,spot,spot_daily,refresh,rank_probe,rank_auto,multi。multi=菜粕/豆油/棕榈油/玉米/豆一主连日K(2017起，v101.25；之后每天23:05随季节性累积自动刷新)。rank_probe=龙虎榜历史能否自动回填的探测；rank_auto=自动回填龙虎榜历史(先跑 rank_probe)。spot=现货/主力价10年回补(可重复点)；默认 main,contracts,cbot,fx；龙虎榜要单独选 dce_rank；probe=探测生意社分地区报价接口(已确认有安全检查，拿不到)；jiangsu=Mysteel全国豆粕价格日报→江苏等地43%豆粕现货价和Mysteel基差(2020年起，建议单独跑一次 only=jiangsu)"
        default: "main,contracts,cbot,fx"
      rank_source:
        description: "only 含 rank_auto 时才填：新浪(sina，2026-10-11 探测：2020~2026 全部样本都有数据，推荐)或东方财富(em，探测只有最近一天有)"
        default: "sina"
      rank_start:
        description: "only 含 rank_auto 时才填：回填起始日，默认 2022-01-01"
        default: "2022-01-01"
      rank_list:
        description: "只有 only 含 dce_rank 时才填：月份:合约，逗号分隔，例如 2023-06:m2309,2023-07:m2309,2023-08:m2401"
        default: ""

permissions:
  contents: write

concurrency:
  group: data-writes
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 语法检查(几秒内发现写错的地方)
        run: python -m compileall -q -f .

      - name: 安装依赖(akshare，精确版本见 requirements-akshare.lock.txt)
        run: pip install -r requirements-akshare.lock.txt

      - name: 抓取原始数据
        env:
          ONLY: ${{ github.event.inputs.only }}
          RANK_LIST: ${{ github.event.inputs.rank_list }}
          RANK_SOURCE: ${{ github.event.inputs.rank_source }}
          RANK_START: ${{ github.event.inputs.rank_start }}
        run: |
          python3 fetch_seasonal_raw.py --only "$ONLY" --rank-list "$RANK_LIST" --rank-source "${RANK_SOURCE:-sina}" --rank-start "${RANK_START:-2022-01-01}" --budget 2400

      # 这一步失败(例如基线CSV被误删)不能拖累下一步：前面抓到的数据必须照样提交，否则白抓。失败原因会显示在这一步的日志里。
      - name: 重新生成季节性统计(data/seasonal.json；合约文件够多就用合约文件，否则用基线CSV)
        continue-on-error: true
        run: python3 seasonal_stats.py --raw data/raw/seasonal --out data/seasonal.json

      - name: 提交
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raw/ data/seasonal.json
          git diff --staged --quiet || git commit -m "抓取季节性原始数据 $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
