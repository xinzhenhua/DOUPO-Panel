<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>豆粕驾驶舱</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F3F0; --surface:#FFFFFF; --sunk:#EAECE8;
  --ink:#0F1A1E; --ink2:#44565C; --ink3:#788A90; --line:#D9DEDB; --line2:#E8ECE9;
  --focus:#B3841A; --focusS:rgba(179,132,26,.13);
  --bull:#D03A33; --bear:#13915B; --bullS:rgba(208,58,51,.075); --bullM:rgba(208,58,51,.15); --bearS:rgba(19,145,91,.075); --bearM:rgba(19,145,91,.15);
  --amber:#D6A01B; --shadow:0 10px 32px rgba(15,26,30,.16);
  --font:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif; --num:"Archivo","Noto Sans SC","PingFang SC",system-ui,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px);
}
:root[data-theme="night"]{
  --bg:#080E11; --surface:#0E171B; --sunk:#0B1316;
  --ink:#E9F0EF; --ink2:#A4B6BA; --ink3:#6C8085; --line:#1C2A2F; --line2:#152228;
  --focus:#E8B84E; --focusS:rgba(232,184,78,.15);
  --bull:#FF6B63; --bear:#3ACB93; --bullS:rgba(255,107,99,.09); --bullM:rgba(255,107,99,.19); --bearS:rgba(58,203,147,.085); --bearM:rgba(58,203,147,.18);
  --amber:#EBBB4A; --shadow:0 10px 32px rgba(0,0,0,.55);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:400 14px/1.5 var(--font);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}
.bull{color:var(--bull)} .bear{color:var(--bear)} .dim{color:var(--ink3)} .dim2{color:var(--ink2)}

/* ===== 外壳：整页就是一块仪表盘面板 ===== */
.app{display:flex;flex-direction:column;min-height:100dvh;background:var(--surface)}
.bar{display:flex;align-items:center;gap:14px;height:52px;padding:0 20px;border-bottom:1px solid var(--line);flex:none;position:relative;z-index:6;background:var(--surface)}
.brand{font-weight:700;font-size:15px;letter-spacing:.06em}
.contract{display:flex;align-items:baseline;gap:7px;padding:6px 10px;margin-left:-6px;border-radius:4px}
.contract:hover{background:var(--focusS)}
.contract b{font-family:var(--num);font-size:17px;font-weight:700}
.contract .nm{font-size:13px;color:var(--ink2)} .contract .md{font-size:12px;color:var(--focus);font-weight:500}
.contract .cr{width:7px;height:7px;border-right:1.5px solid var(--ink3);border-bottom:1.5px solid var(--ink3);transform:translateY(-2px) rotate(45deg)}
.sess{display:flex;align-items:center;gap:7px;font-size:13px;padding:4px 10px;border-radius:99px;background:var(--focusS);color:var(--ink);font-weight:500;white-space:nowrap}
.sess i{width:7px;height:7px;border-radius:50%;background:var(--focus)}
.sess.open i{background:var(--bear)}
.sess span{color:var(--ink2);font-weight:400}
.right{margin-left:auto;display:flex;align-items:center;gap:6px}
.sync{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink2);margin-right:6px;white-space:nowrap}
.sync i{width:7px;height:7px;border-radius:50%;border:1.5px solid var(--ink3)}
.sync.note i{background:var(--amber);border-color:var(--amber)}
.tb{padding:6px 11px;border-radius:4px;font-size:13px;color:var(--ink2);white-space:nowrap}
.tb:hover{background:var(--focusS);color:var(--ink)}
.tb[aria-pressed="true"]{background:var(--focusS);color:var(--ink);font-weight:500}
.pop{position:absolute;top:48px;left:14px;min-width:280px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px;box-shadow:var(--shadow);z-index:30;display:none}
.pop.on{display:block}
.pop button{display:grid;grid-template-columns:1fr auto;gap:2px 10px;width:100%;padding:9px 11px;border-radius:4px}
.pop button:hover,.pop button[aria-current="true"]{background:var(--focusS)}
.pop .t{font-weight:500} .pop .s{grid-column:1/-1;font-size:12.5px;color:var(--ink2)} .pop .tag{font-size:12px;color:var(--focus);font-weight:500;align-self:center}
.pop .ft{padding:8px 11px 4px;border-top:1px solid var(--line2);margin-top:4px;font-size:12.5px;color:var(--ink3)}

/* ===== 状态带 ===== */
.band{display:grid;grid-template-columns:1.2fr 1.1fr 1fr 1.15fr;border-bottom:1px solid var(--line);flex:none;min-height:clamp(104px,14.5vh,138px)}
.cell{padding:12px 20px;border-right:1px solid var(--line);min-width:0;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:3px;overflow:hidden}
.cell>*{max-width:100%}
.cell .cl{align-self:stretch}
.cell:last-child{border-right:0}
.cl{font-size:12.5px;color:var(--ink3);display:flex;align-items:center;gap:7px}
.cl .q{margin-left:auto}
.big{font-size:clamp(24px,3.6vh,34px);font-weight:700;line-height:1.2;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.big small{font-size:.5em;font-weight:500;color:var(--ink2);margin-left:8px;letter-spacing:0}
.sub{font-size:13px;color:var(--ink2);line-height:1.45}
.q{width:19px;height:19px;border-radius:50%;border:1px solid var(--line);font-size:11px;line-height:17px;text-align:center;color:var(--ink3);flex:none}
.q:hover{border-color:var(--focus);color:var(--focus)}
.regime.trend_up .big,.regime.up .big{color:var(--bull)} .regime.trend_down .big{color:var(--bear)} .regime.capital .big{color:var(--amber)}
.mark{width:4px;align-self:stretch;border-radius:2px;background:var(--line);flex:none}
.px{display:flex;align-items:baseline;gap:10px}
.px .p{font-family:var(--num);font-size:clamp(26px,4vh,38px);font-weight:700;line-height:1}
.px .c{font-family:var(--num);font-size:15px;font-weight:600}
.seq{display:flex;gap:4px;margin-top:2px;align-items:center}
.seq i{width:30px;height:17px;border-radius:2px;background:var(--line2);flex:none;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:11px;font-weight:600;color:var(--ink2);line-height:1}
.seq i.sb{background:var(--bull);color:#fff} .seq i.sx{background:var(--bear);color:#fff} .seq i.wb{background:var(--bullM);color:var(--bull)} .seq i.wx{background:var(--bearM);color:var(--bear)}
.seq i.na{background:repeating-linear-gradient(135deg,var(--line2) 0 3px,transparent 3px 6px)}
.seq span{font-size:12.5px;color:var(--ink2);margin-left:6px;white-space:nowrap}
.fund{display:flex;align-items:center;gap:12px}
.fund svg.sp{width:92px;height:34px;flex:none;overflow:visible}


/* ===== 交易信号条（首页） ===== */
.sigbar{display:grid;grid-template-columns:1.55fr 1fr;border-bottom:1px solid var(--line);flex:none}
.sg{display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:9px 20px;text-align:left;border-right:1px solid var(--line);min-width:0}
.sg:last-child{border-right:0}
.sg:hover{background:var(--focusS)}
.sg .cl{font-size:12px;color:var(--ink3)}
.sg .hd{font-size:19px;font-weight:600;line-height:1.25}
.sg .sb{font-size:12.5px;color:var(--ink2);line-height:1.4}
.sg.long .hd{color:var(--bull)} .sg.short .hd{color:var(--bear)} .sg.wait .hd{color:var(--ink2)}
.sg.pos.exit{background:color-mix(in srgb,var(--amber) 16%,transparent);box-shadow:inset 4px 0 0 var(--amber)}
.sg.pos.exit .hd{color:var(--amber)}
.scs{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;margin-top:2px}
.sc{font-size:12px;padding:1px 8px;border-radius:10px;border:1px solid var(--line);color:var(--ink3);white-space:nowrap}
.sc.y{color:var(--ink);border-color:var(--ink3)} .sc.sep{border:0;padding:0 2px;color:var(--ink3)}
.vd{padding:8px 12px;border-radius:6px;border:1px solid var(--line)}
.vd.exit{border-color:var(--amber);background:color-mix(in srgb,var(--amber) 14%,transparent)}
.pbtn{margin:6px 0 4px;padding:7px 16px;border:1px solid var(--ink3);border-radius:4px;background:var(--sunk);color:var(--ink);font:inherit;cursor:pointer}
.pbtn:hover{background:var(--focusS)} .pbtn.warn{border-color:var(--amber);font-weight:600}
.xbtn{padding:0 8px;color:var(--ink3);font-size:16px;line-height:1.2} .xbtn:hover{color:var(--bear)}
.lnk{color:var(--focus);text-decoration:underline;cursor:pointer;background:none;border:0;padding:0;font:inherit}
.pmsg{border:1px solid var(--amber);border-radius:4px;padding:6px 10px}
#planBody details{margin:10px 0 0;border-top:1px solid var(--line2);padding-top:8px} #planBody summary{cursor:pointer;color:var(--ink2);font-size:13px}


/* ===== 交易 / 研究 模式 ===== */
.modes{margin-left:12px;flex:none}
.tradepane{display:none;flex-direction:column;min-width:0;min-height:0;overflow-y:auto;padding:14px 20px 16px}
body.mode-trade .tradepane{display:flex}
body.mode-trade .wall,body.mode-trade .band,body.mode-trade .dock{display:none}
body.mode-research .tradepane{display:none}
.dsl{margin-top:6px;font-size:12px;line-height:1.4;padding:3px 8px;border-radius:6px;display:inline-block}
.dsl.ok{background:rgba(46,160,90,.14);color:var(--ink)}.dsl.part{background:rgba(224,160,40,.18);color:var(--ink)}.dsl.bad{background:rgba(220,60,60,.18);color:var(--ink);font-weight:600}
.sg.gate{background:color-mix(in srgb,var(--amber) 10%,transparent)} .sg.gate .hd{color:var(--amber)}
.scs.dim{opacity:.45}
@media(min-width:900px){.sigbar .hd{font-size:22px}}

/* ===== 检查条 ===== */
.checks{display:flex;align-items:center;gap:2px;height:40px;padding:0 14px;border-bottom:1px solid var(--line);flex:none;overflow-x:auto;scrollbar-width:none}
.checks::-webkit-scrollbar{display:none}
.lp{display:flex;align-items:center;gap:7px;padding:5px 11px;border-radius:4px;white-space:nowrap;font-size:13px}
.lp:hover{background:var(--focusS)}
.lp .k{color:var(--ink3)} .lp .v{font-weight:500}
.lamp{width:15px;height:15px;flex:none}
.lamp circle{fill:none;stroke:var(--ink3);stroke-width:1.5}
.lamp.note circle{fill:var(--amber);stroke:var(--amber)} .lamp.warn circle{fill:var(--amber);stroke:var(--ink);stroke-width:1.7}
.lamp.warn path{stroke:var(--ink);stroke-width:2;stroke-linecap:round;fill:none} .lamp.na circle{stroke-dasharray:2.2 2.2}
.sp1{flex:1;min-width:8px}
.rule{margin-left:auto;font-size:12.5px;color:var(--ink3);padding:5px 10px;border-radius:4px;white-space:nowrap}
.rule:hover{background:var(--focusS);color:var(--ink)}

/* ===== 主体：左图表，右趋势墙 ===== */
.main{display:grid;grid-template-columns:minmax(0,43fr) minmax(0,57fr);flex:1 1 auto;min-height:0}
.chart{border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0;min-height:0;padding:14px 20px 12px;overflow-y:auto}
.ch-h{display:flex;align-items:center;gap:10px;margin-bottom:6px;flex:none}
.ch-h .t{font-weight:600;font-size:14px}
.seg{display:flex;border:1px solid var(--line);border-radius:5px;overflow:hidden}
.seg button{padding:3px 10px;font-size:12.5px;color:var(--ink2);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface);font-weight:500}
.seg button:not([aria-pressed="true"]):hover{background:var(--focusS)}
.seg{flex-shrink:0}.seg button{white-space:nowrap}
.vtabs{display:flex;width:100%;margin:2px 0 8px}.vtabs button{flex:1;padding:7px 2px;font-size:13px;text-align:center}
.ch-r{display:flex;justify-content:flex-end;margin:0 0 6px}
.hl{font-size:14.5px;line-height:1.55;margin:2px 0 10px}.hl b{font-family:var(--num);font-size:16px}
.mbars{position:relative;display:flex;gap:3px;margin:6px 0 4px}
.mc{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:3px 0;border-radius:5px;min-width:0}
.mc.now{background:var(--focusS);outline:1px solid var(--focus)}
.mc .mb{position:relative;width:100%;height:110px;display:flex;align-items:flex-end;justify-content:center}.mc .mb i{display:block;width:62%;border-radius:2px 2px 0 0}
.mc .mv{font-size:11px;font-family:var(--num);color:var(--ink2)}.mc .mm{font-size:11px;color:var(--ink2)}.mc .mr{font-size:10.5px;font-family:var(--num)}
.m50{position:absolute;left:0;right:0;top:74px;border-top:1px dashed var(--ink3);pointer-events:none}
.mleg{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:var(--ink3);margin-bottom:8px;flex-wrap:wrap}
.ruler{position:relative;margin:4px 0}.ruler .vline{position:absolute;top:0;bottom:0;width:0;border-left:1.5px dashed var(--ink);z-index:1;pointer-events:none}
.cr{padding:6px 0}.cl2{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink2);margin-bottom:4px;gap:8px}.cl2 b{color:var(--ink);font-family:var(--num);font-weight:600}
.ct{position:relative;height:16px;background:var(--sunk);border-radius:8px}
.ct .dot{position:absolute;top:2px;width:12px;height:12px;border-radius:50%;transform:translateX(-6px)}
.ct .bandx{position:absolute;top:3px;height:10px;border-radius:5px;opacity:.75}

.ptr{display:flex;flex-direction:column;gap:3px;flex:none;margin:2px 0 8px}
.pr2{display:grid;grid-template-columns:2.6em repeat(3,max-content);gap:4px 22px;align-items:baseline;font-size:13px}
.pr2 .pnm{color:var(--ink3);font-size:12.5px}
.pc{display:flex;gap:6px;align-items:baseline;white-space:nowrap;min-width:0}
.pc i{font-style:normal;font-size:11.5px;color:var(--ink3)} .pc b{font-family:var(--num);font-size:15px;font-weight:700} .pc.na b{color:var(--ink3);font-weight:400}
.kl{position:relative;flex:1 1 auto;min-height:190px}
.kl svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.kl .tip{position:absolute;left:0;top:0;font-family:var(--num);font-size:12px;color:var(--ink2);background:var(--surface);padding:1px 6px;pointer-events:none;border-radius:3px}
.kl .lv{font-size:11px;fill:var(--ink2);font-family:var(--num)}
.rng{flex:none;margin-top:8px}
.rng .l1{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink2);margin-bottom:5px}
.rng .l1 b{color:var(--ink);font-weight:600}
.rtrack{position:relative;height:8px;border-radius:4px;background:linear-gradient(90deg,var(--bearM),var(--sunk) 35%,var(--sunk) 65%,var(--bullM))}
.rtrack i{position:absolute;top:-4px;width:4px;height:16px;border-radius:2px;background:var(--ink);transform:translateX(-2px)}
.rng .l2{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink3);margin-top:4px}
.ctr{display:grid;grid-template-columns:1fr 1fr;gap:3px 14px;flex:none;margin-top:8px;font-size:12.5px;color:var(--ink2)}
.ctr .r{display:flex;gap:10px;flex-wrap:nowrap;white-space:nowrap;overflow:hidden}
.ctr b{font-family:var(--num);font-weight:600;color:var(--ink);margin-left:4px}

.wall{display:flex;flex-direction:column;min-width:0;min-height:0}
.wh{display:flex;align-items:center;gap:12px;height:44px;padding:0 20px;border-bottom:1px solid var(--line2);flex:none}
.wh .t{font-weight:600;font-size:14px}
.wh .hint{font-size:12.5px;color:var(--ink3);margin-left:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tiles{flex:1 1 auto;min-height:0;display:grid;background:var(--line2);gap:1px;border-bottom:0}
.tile{container-type:inline-size;position:relative;background:var(--surface);padding:10px 12px 8px 16px;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(22px,1fr) auto;gap:2px;min-width:0;min-height:0;overflow:hidden;text-align:left}
.tile:hover{background:var(--sunk)}
.tile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--line)}
.tile.sb::before{background:var(--bull)} .tile.sx::before{background:var(--bear)}
.tile.tb2{background:linear-gradient(var(--bullS),var(--bullS)),var(--surface)} .tile.tx2{background:linear-gradient(var(--bearS),var(--bearS)),var(--surface)}
.tile.tb3{background:linear-gradient(var(--bullM),var(--bullM)),var(--surface)} .tile.tx3{background:linear-gradient(var(--bearM),var(--bearM)),var(--surface)}
.tile:hover.tb2,.tile:hover.tb3,.tile:hover.tx2,.tile:hover.tx3{filter:brightness(.97)}
.t1{display:flex;align-items:center;gap:6px;min-height:20px}
.t1 .n{font-size:13px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1 1 auto;min-width:0}
.t1 .bd{flex:none;font-size:11px;font-weight:500;padding:0 5px;border-radius:3px;white-space:nowrap;line-height:17px}
.t1 .n{flex:1 1 0}
.t2{display:flex;align-items:baseline;gap:4px;white-space:nowrap;overflow:hidden;min-width:0}
.t2 .v{font-family:var(--num);font-size:clamp(19px,2.9vh,26px);font-weight:700;line-height:1.2;flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:clip}
.t2 .u{font-size:12px;color:var(--ink3);flex:none;line-height:1}
.bd.up{background:var(--bullM);color:var(--bull)} .bd.down{background:var(--bearM);color:var(--bear)} .bd.m{background:var(--sunk);color:var(--ink2)}
.sk{min-height:22px;margin:1px -2px;position:relative}
.sk svg{position:absolute;inset:0;width:100%;height:100%;display:block;overflow:visible}
svg .ln{fill:none;stroke-width:1.9;stroke-linejoin:round;stroke-linecap:round}
svg .ar{stroke:none}
.sk .na{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--ink3);background:repeating-linear-gradient(135deg,transparent 0 5px,var(--line2) 5px 6px);text-align:center;padding:0 6px;line-height:1.35}
.chips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
.chip{min-width:0}
.chip .l{font-size:clamp(9px,6.6cqw,10.5px);color:var(--ink3);line-height:1.2}
.chip .a{font-family:var(--num);font-size:clamp(9.5px,7.4cqw,12.5px);font-weight:600;white-space:nowrap;line-height:1.3;overflow:hidden;text-overflow:clip}      /* 字号随格子宽度缩：150px宽的格子≈11px，放得下“↑103%” */
.chip.na .a{color:var(--ink3);font-weight:400}
.more{display:flex;align-items:center;justify-content:center;color:var(--ink2);font-weight:500;background:var(--sunk)}
.tiles.blocks{display:flex;flex-direction:column;gap:1px;background:var(--line2)}
.blk{display:grid;grid-template-columns:22px minmax(0,1fr);min-height:0;background:var(--line2);gap:1px}
.rail{background:var(--sunk);display:flex;align-items:center;justify-content:center;min-height:0;overflow:hidden}
.rail span{writing-mode:vertical-rl;letter-spacing:.28em;font-size:12px;font-weight:500;color:var(--ink2);white-space:nowrap}
.bg{display:grid;gap:1px;background:var(--line2);min-width:0;min-height:0}
.bh{display:flex;align-items:baseline;gap:8px;padding:10px 16px 6px;background:var(--surface);border-top:1px solid var(--line);font-size:13px;font-weight:600;color:var(--ink2)}
.bh i{font-style:normal;font-weight:400;font-size:12px;color:var(--ink3)}
.tile.pend{background:var(--sunk);grid-template-rows:auto minmax(0,1fr)}
.tile.pend .t1 .n small{font-size:11px;color:var(--ink3);font-weight:400;margin-left:4px}
.pr.tr3{grid-template-columns:4.3em minmax(0,1fr);gap:0 8px;margin-bottom:3px}
.pr.tr3 .pa{grid-column:1/-1}      /* 趋势行两行：名称+数值一行，三期箭头一行，150px宽的汇总格也放得下 */
.pr .pa{display:flex;gap:clamp(3px,3cqw,8px);justify-content:flex-start;white-space:nowrap;overflow:hidden;font-family:var(--num);font-size:clamp(9.5px,6.8cqw,11.5px)}      /* 汇总格也是容器：箭头字号随格子宽度缩 */

<body>
<div class="boot" id="boot" role="status" aria-live="polite"><div class="bx"><div class="sp" id="bootSp"></div><h1 id="bootT">豆粕驾驶舱</h1><p id="bootM">正在启动评分引擎并读取数据…</p><div id="bootX"></div></div></div>
<div class="app" id="app">
  <header class="bar">
    <span class="brand">豆粕</span>
    <button class="contract" id="cBtn" aria-haspopup="true" aria-expanded="false" aria-label="交易合约，点击查看或手动切换"><b id="cSym">—</b><span class="nm" id="cName"></span><span class="md" id="cMode"></span><i class="cr"></i></button>
    <div class="pop" id="cPop" role="menu"></div>
    <div class="sess" id="sess"></div>
    <div class="seg modes" id="modeSeg" role="group" aria-label="切换模式"><button data-mode="trade" aria-pressed="true">交易</button><button data-mode="research" aria-pressed="false" title="基本面趋势、市场状态、证据页">研究</button></div>
    <div class="right">
      <div class="sync" id="sync"></div>
      <button class="tb" id="exBtn" aria-pressed="false" title="显示每一块的白话说明（快捷键 E）">解释</button>
      <button class="tb opt" id="thBtn" title="日夜主题：自动按时间切换">主题</button>
      <button class="tb" id="abBtn" title="方法与口径（快捷键 ?）">说明</button>
    </div>
  </header>
  <section class="sigbar" id="sigbar" aria-label="交易信号与持仓"></section>
  <section class="band" id="band" aria-label="背景：市场状态、基本面、资金面"></section>
  <nav class="checks" id="checks" aria-label="交易前检查"></nav>
  <main class="main">
    <section class="chart" id="chart" aria-label="价格与持仓"></section>
    <section class="wall" id="wall" aria-label="趋势墙"></section>
    <section class="tradepane" id="tradePanel" aria-label="交易计划"></section>
  </main>
  <nav class="dock" aria-label="证据">
    <span class="lb">证据</span>
    <button class="tab" data-tab="drivers">驱动<span class="kb">1</span></button>
    <button class="tab" data-tab="supply">供给<span class="kb">2</span></button>
    <button class="tab" data-tab="demand">需求<span class="kb">3</span></button>
    <button class="tab" data-tab="capital">资金<span class="kb">4</span></button>
    <button class="tab" data-tab="data">数据<span class="kb">5</span></button>
    <button class="tab" data-tab="input">录入<span class="kb">6</span></button>
    <span class="note" id="dockNote"></span>
  </nav>
</div>
<div class="scrim" id="scrim"></div>
<aside class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="shT" aria-hidden="true">
  <div class="sh-h"><h2 id="shT"></h2><button class="sh-x" id="shX">关闭</button></div>
  <div class="sh-t" id="shTabs" role="tablist"></div>
  <div class="sh-b" id="shB"></div>
</aside>
<script>
/* 豆粕驾驶舱：纯计算模块(浏览器和Node通用)。所有"趋势/状态/布局/主题"的判断都在这里，界面只负责画。
 * 每个函数都有对应的测试(tests_logic.js)；ADX用TA-Lib做外部参考对拍。 */
(function (root) {
  'use strict';
  const L = {};
  const DAY = 86400000;

  /* ---------- 常量(与正式页面一致或来自参考文档，暂定未回测的都标了) ---------- */
  L.K = {
    DIR: 0.22,            // 基本面净倾向阈值，与正式页面 DIRECTION_RATIO 一致
    GS_HIGH: 120000,      // 高盛净多≥12万手=高位(参考文档，暂定，未回测)
    GS_RETREAT: -20000,   // 高盛单日净多变化≤-2万手=撤退预警(参考文档，暂定)
    CFTC_PCT: 90,         // CFTC近156周分位≥90=拥挤(参考文档，暂定)
    ADX_N: 14, ADX_TREND: 25, ADX_RANGE: 20,   // Wilder的通用约定：≥25趋势，<20震荡(教科书值，没有针对豆粕标定)
    DONCHIAN: 20,         // 突破判断：收盘价是否越过前20根的最高/最低
    DI_GAP: 5,            // +DI与−DI至少差5点才算方向清楚(真实1月合约 ADX=28.7 但+DI只比−DI高1.4，方向不可信——用真实数据发现的)
    FLAT_EPS: 0.004       // 趋势"持平"阈值：变化小于该序列典型水平的0.4%
  };

  /* ---------- 日期 ---------- */
  // 'YYYY-MM-DD' → UTC毫秒；'YYYY-MM' → 当月15日；'YYYY' → 当年7月1日(年度数据)
  L.parseDate = function (d) {
    const s = String(d);
    let m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s);
    if (m) return Date.UTC(+m[1], +m[2] - 1, +m[3]);
    m = /^(\d{4})-(\d{2})$/.exec(s);
    if (m) return Date.UTC(+m[1], +m[2] - 1, 15);
    m = /^(\d{4})$/.exec(s);
    if (m) return Date.UTC(+m[1], 6, 1);
    return NaN;
  };

  const median = a => { const s = [...a].sort((x, y) => x - y), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
  L.median = median;

  /* ---------- 趋势：按日历时间(不是按第几个点)，缺周/缺日也不会算错 ---------- */
  // 频率→三个对比跨度(日历天)与标签。短/中/长=约1周/1月/1季；月度数据最短1月，年度数据按年。
  L.SPECS = {
    daily:   { spans: [7, 30, 91],       labels: ['1周', '1月', '3月'],   tol: [3, 8, 14] },
    weekly:  { spans: [7, 28, 91],       labels: ['1周', '4周', '13周'],  tol: [3, 6, 14] },
    monthly: { spans: [30, 91, 182],     labels: ['1月', '3月', '6月'],   tol: [16, 20, 25] },
    yearly:  { spans: [365, 1095, 1825], labels: ['1年', '3年', '5年'],   tol: [90, 120, 150] }
  };
  L.specFor = function (freq) {
    if (freq === 'seasonal-daily') return L.SPECS.daily;
    if (freq === 'irregular' || freq === 'quarterly') return L.SPECS.monthly;
    return L.SPECS[freq] || L.SPECS.daily;
  };

  // 找到最接近 target(ms) 且在容差内的点；没有就返回 null
  L.pointNear = function (pts, target, tolDays) {
    let best = null, bd = Infinity;
    for (const p of pts) {
      const t = L.parseDate(p.d); if (isNaN(t)) continue;
      const dd = Math.abs(t - target);
      if (dd < bd) { bd = dd; best = p; }
    }
    return best && bd <= tolDays * DAY ? best : null;
  };

  // 相邻点间隔超过 maxGapDays 就视为新的一段；返回最后一段(季节性序列只在建议窗口内有数据，跨年的点不能连起来看趋势)
  L.currentRun = function (pts, maxGapDays) {
    maxGapDays = maxGapDays || 10;
    if (!pts || !pts.length) return [];
    let start = pts.length - 1;
    while (start > 0 && (L.parseDate(pts[start].d) - L.parseDate(pts[start - 1].d)) <= maxGapDays * DAY) start--;
    return pts.slice(start);
  };

  L.movingAvg = function (pts, k) {
    return pts.map((p, i) => i < k - 1 ? null : { d: p.d, v: pts.slice(i - k + 1, i + 1).reduce((a, x) => a + x.v, 0) / k }).filter(Boolean);
  };

  // 单个跨度的变化：返回 {from,to,change,pct,dir} 或 null
  L.spanChange = function (pts, spanDays, tolDays, scale) {
    if (!pts || pts.length < 2) return null;
    const last = pts[pts.length - 1], tl = L.parseDate(last.d);
    const ref = L.pointNear(pts.slice(0, -1), tl - spanDays * DAY, tolDays);
    if (!ref) return null;
    const change = last.v - ref.v;
    const eps = L.K.FLAT_EPS * (scale || Math.abs(ref.v) || 1);
    const dir = Math.abs(change) < eps ? 0 : change > 0 ? 1 : -1;
    const pct = Math.abs(ref.v) > 1e-9 ? change / Math.abs(ref.v) : null;
    return { from: ref, to: last, change, pct, dir };
  };

  // 三个周期的趋势。opts: {pol(数值升高对多空的影响 +1/-1/0), freq}
  L.trend = function (pts, opts) {
    opts = opts || {};
    const spec = L.specFor(opts.freq);
    let data = pts || [];
    if (opts.freq === 'seasonal-daily') data = L.currentRun(data, 10);
    const recent = data.slice(-60).map(p => Math.abs(p.v));
    const scale = recent.length ? median(recent) : 1;
    const chips = spec.spans.map((sp, i) => {
      const c = L.spanChange(data, sp, spec.tol[i], scale);
      return { label: spec.labels[i], span: sp, ...(c ? c : { from: null, to: null, change: null, pct: null, dir: null }), ok: !!c };
    });
    const pol = opts.pol == null ? 0 : opts.pol;
    chips.forEach(c => { c.meaning = (!c.ok || c.dir === 0 || pol === 0) ? 0 : c.dir * pol; });   // +1偏多(红) -1偏空(绿) 0中性
    const dirs = chips.filter(c => c.ok).map(c => c.dir);
    let badge = null;
    if (dirs.length >= 2 && dirs.every(d => d === 1)) badge = 'up';
    else if (dirs.length >= 2 && dirs.every(d => d === -1)) badge = 'down';
    else if (chips[0].ok && chips[1].ok && chips[2].ok && chips[1].dir === chips[2].dir && chips[1].dir !== 0 && chips[0].dir === -chips[1].dir) badge = chips[1].dir === 1 ? 'pullback' : 'rebound';
    return { chips, badge, n: data.length, spec, last: data.length ? data[data.length - 1] : null };
  };

  /* ---------- ADX(Wilder)，实现与TA-Lib一致 ---------- */
  L.adx = function (bars, n) {
    n = n || L.K.ADX_N;
    const N = bars.length;
    if (N < 2 * n + 1) return null;
    const tr = [], pdm = [], mdm = [];
    for (let i = 1; i < N; i++) {
      const up = bars[i].h - bars[i - 1].h, dn = bars[i - 1].l - bars[i].l;
      pdm.push(up > dn && up > 0 ? up : 0);
      mdm.push(dn > up && dn > 0 ? dn : 0);
      tr.push(Math.max(bars[i].h - bars[i].l, Math.abs(bars[i].h - bars[i - 1].c), Math.abs(bars[i].l - bars[i - 1].c)));
    }
    // 与TA-Lib一致：种子只累计前 n-1 个差分，之后每一个差分(含第n个)都做一次 Wilder 平滑 s = s - s/n + x。
    // (上一版多累计了1个，+DI起点差0.12、ADX序列最大差0.86，被TA-Lib对拍测试发现；改后最大差1e-14)
    let sTR = 0, sP = 0, sM = 0;
    for (let i = 0; i < n - 1; i++) { sTR += tr[i]; sP += pdm[i]; sM += mdm[i]; }
    const dx = [], pdi = [], mdi = [];
    for (let i = n - 1; i < tr.length; i++) {
      sTR = sTR - sTR / n + tr[i]; sP = sP - sP / n + pdm[i]; sM = sM - sM / n + mdm[i];
      const p = sTR ? 100 * sP / sTR : 0, m = sTR ? 100 * sM / sTR : 0;
      pdi.push(p); mdi.push(m); dx.push(p + m ? 100 * Math.abs(p - m) / (p + m) : 0);
    }
    let a = 0;
    for (let i = 0; i < n; i++) a += dx[i];
    a /= n;
    const series = [a];
    for (let i = n; i < dx.length; i++) { a = (a * (n - 1) + dx[i]) / n; series.push(a); }
    return { adx: a, pdi: pdi[pdi.length - 1], mdi: mdi[mdi.length - 1], series, pdiSeries: pdi, mdiSeries: mdi };
  };

  /* ---------- 资金面状态：与后端 fetch_data._capital_state 逐字一致(见 tests_logic.js 的对拍) ---------- */
  L.capitalState = function (gsNet, gsChange, cftcPct) {
    const K = L.K;
    if (gsNet == null) gsChange = null;      // 高盛不在榜时不存在"当日变化"(与后端 _capital_state 一致：gs 为空则 change 也为空)——对拍发现JS端漏了
    const gsHigh = gsNet != null && gsNet >= K.GS_HIGH, crowded = cftcPct != null && cftcPct >= K.CFTC_PCT;
    const fmt = n => Math.abs(Math.round(n)).toLocaleString('en-US');
    if (gsChange != null && gsChange <= K.GS_RETREAT) return { code: 'retreat', level: 'yellow', label: '外资撤退预警：高盛当日减仓' + fmt(gsChange) + '手' };
    if (gsHigh && crowded) return { code: 'crowded', level: 'red', label: '外资多头拥挤' };
    if (gsHigh) return { code: 'elevated', level: 'yellow', label: '外资多头高位(高盛净多头在高位，CFTC未到拥挤)' };
    if (crowded) return { code: 'elevated', level: 'yellow', label: '外资多头高位(依据：CFTC管理基金净多到顶；高盛未进榜或不在高位)' };
    if (gsNet == null && cftcPct == null) return { code: 'unknown', level: 'gray', label: '外资状态：数据不足' };
    if (gsNet == null || cftcPct == null) return { code: 'unknown', level: 'gray', label: "外资状态：数据不足(高盛或CFTC缺一项，不下'中性'结论)" };
    return { code: 'neutral', level: 'green', label: '外资中性(高盛净多头不在高位，CFTC不拥挤)' };
  };

  // CFTC周序列统计：口径与来源 fetch_cftc_managed_money 一致(分位=历史里<=当前的占比，含并列；连续周数=从最新往回同向变化的周数)
  L.cftcStats = function (pts) {
    if (!pts || pts.length < 2) return null;
    const v = pts.map(p => p.v), last = v[v.length - 1];
    const pct = Math.round(v.filter(x => x <= last).length / v.length * 1000) / 10;
    let streak = 0, dir = null;
    for (let i = v.length - 1; i > 0; i--) {
      const d = v[i] - v[i - 1], s = d > 0 ? 'up' : d < 0 ? 'down' : null;
      if (s === null) break;
      if (dir === null) { dir = s; streak = 1; } else if (s === dir) streak++; else break;
    }
    return { net: last, change: last - v[v.length - 2], streak, dir, percentile: pct, weeks: v.length, date: pts[pts.length - 1].d };
  };

  /* ---------- 市场状态：震荡 / 趋势 / 资金市迹象 / 方向待定 ---------- */
  // bars: [{h,l,c,oi}]；ctx: {capitalCode, fundRatio}
  // 市场状态分两步：①从K线算指标(ADX、突破、均线、持仓变化) ②classify按指标和资金/基本面判定。拆开是为了测试能直接给定指标逐道验证每个防线。
  L.indicators = function (bars) {
    const K = L.K, N = bars.length;
    const a = L.adx(bars, K.ADX_N);
    if (!a || N < K.DONCHIAN + 2) return null;
    const last = bars[N - 1].c;
    const prior = bars.slice(N - 1 - K.DONCHIAN, N - 1);                   // 前20根，不含今天
    const hi = Math.max(...prior.map(x => x.h)), lo = Math.min(...prior.map(x => x.l));
    const ma20 = bars.slice(N - 20).reduce((x, y) => x + y.c, 0) / 20;
    const oi5 = N > 5 && bars[N - 6].oi ? bars[N - 1].oi / bars[N - 6].oi - 1 : null;
    return { adx: a.adx, pdi: a.pdi, mdi: a.mdi, last, hi, lo, ma20, oi5, breakout: last > hi ? 'up' : last < lo ? 'down' : null, raw: a };
  };

  L.classify = function (ind, ctx) {
    ctx = ctx || {};
    const K = L.K;
    if (!ind) return { code: 'na', label: '数据不足', reason: 'K线不够，判断不了震荡还是趋势', conds: [], met: 0, of: 0 };
    const { adx, pdi, mdi, last, hi, lo, ma20, oi5, breakout } = ind;
    const strong = adx >= K.ADX_TREND, weak = adx < K.ADX_RANGE;
    // 趋势方向要同时满足：①+DI与−DI差距够大(否则方向不可信) ②收盘价在20日均线的同一侧(价格自己也认这个方向)。ADX只回答"有没有趋势"，不回答"往哪边"。
    const gap = Math.abs(pdi - mdi), diDir = pdi > mdi ? 'up' : 'down';
    const sideOk = diDir === 'up' ? last > ma20 : last < ma20;
    const clear = gap >= K.DI_GAP && sideOk;
    const dir = diDir;
    const crowded = ctx.capitalCode === 'crowded';
    const priceUp = (strong && clear && dir === 'up') || breakout === 'up';       // 资金市要求价格真的在涨：突破前高，或强趋势且方向清楚地向上
    const fundNotBull = ctx.fundRatio == null ? null : ctx.fundRatio < K.DIR;
    const conds = [
      { k: 'adx', text: '趋势强度 ADX ' + adx.toFixed(1) + '（≥' + K.ADX_TREND + ' 算趋势，<' + K.ADX_RANGE + ' 算震荡）', met: strong },
      { k: 'dir', text: '上升力量 +DI ' + pdi.toFixed(1) + ' / 下降力量 −DI ' + mdi.toFixed(1) + (gap < K.DI_GAP ? '（差距不足 ' + K.DI_GAP + '，方向不清）' : ''), met: strong ? clear : null },
      { k: 'ma', text: '收盘价 ' + last + ' 在20日均线 ' + ma20.toFixed(0) + (last > ma20 ? ' 上方' : ' 下方'), met: null },
      { k: 'brk', text: '收盘价 ' + last + (breakout === 'up' ? ' 突破前' + K.DONCHIAN + '日最高 ' + hi : breakout === 'down' ? ' 跌破前' + K.DONCHIAN + '日最低 ' + lo : ' 在前' + K.DONCHIAN + '日区间 ' + lo + '~' + hi + ' 之内'), met: breakout !== null },
      { k: 'oi', text: oi5 == null ? '持仓量变化不可用' : '近5日持仓量 ' + (oi5 >= 0 ? '+' : '−') + Math.abs(oi5 * 100).toFixed(1) + '%', met: oi5 == null ? null : oi5 > 0 },
      { k: 'cap', text: '外资多头拥挤', met: crowded },
      { k: 'fund', text: ctx.fundRatio == null ? '基本面净倾向不可用' : '基本面没有明显偏多（净倾向 ' + (ctx.fundRatio * 100).toFixed(0) + '%，偏多线 +' + K.DIR * 100 + '%）', met: fundNotBull }
    ];
    let code, label, reason;
    if (crowded && priceUp && fundNotBull === true) {
      code = 'capital'; label = '资金市迹象'; reason = '外资拥挤，价格在涨，基本面没跟上';
    } else if (strong && !clear) {
      code = 'unclear'; label = '方向待定'; reason = '趋势强度够，但上升和下降的力量差不多，方向不清';
    } else if (strong) {
      code = 'trend_' + dir; label = dir === 'up' ? '趋势市 · 上行' : '趋势市 · 下行';
      reason = dir === 'up' ? '价格持续上行' + (oi5 != null && oi5 > 0 ? '，新资金在进场' : '') : '价格持续下行' + (oi5 != null && oi5 < 0 ? '，但持仓在减少，空头也没有加码' : oi5 != null && oi5 > 0 ? '，新空头在进场' : '');
    } else if (weak) {
      code = 'range'; label = '震荡市'; reason = '价格来回波动，没有明显方向';
    } else {
      code = 'unclear'; label = '方向待定'; reason = '介于震荡和趋势之间，趋势在形成或在衰减';
    }
    const used = conds.filter(c => c.met !== null);
    return { code, label, reason, conds, met: used.filter(c => c.met).length, of: used.length, adx: { adx, pdi, mdi }, breakout, hi, lo, oi5, crowded, priceUp, fundNotBull, ma20, clear };
  };

  L.regime = function (bars, ctx) { return L.classify(L.indicators(bars), ctx); };

  /* ---------- 布局规划：保证趋势墙放得下，放不下的折进"更多"，不靠滚动条兜底 ---------- */
  L.GRID_ASPECT = 1.5;      // 格子理想宽高比(宽:高)
  L.GRID_MIN = { minW: 150, minH: 134, maxCols: 6 };      // 实测值，测试和实现共用这一份
  L.planGrid = function (W, H, n, o) {
    // minH=134：真浏览器实测一个格子的最小内容高度≈128px(名称20+数值31+曲线22+周期31+上下内边距18+行距6)，留余量。minW=150：数值+单位+三个周期不换行所需宽度。
    o = Object.assign({}, L.GRID_MIN, o || {});
    const maxC = Math.max(1, Math.min(o.maxCols, Math.floor(W / o.minW)));
    let best = null;
    for (let c = maxC; c >= 1; c--) {
      const rows = Math.ceil(n / c);
      if (rows * o.minH <= H) {      // rows>=1，所以这个条件已蕴含 H>=minH，不需要再写一遍(变异检查发现的冗余条件)
        // 打分 = 面积 × 宽高比惩罚。只比面积会偏爱"少浪费一格"的窄长版式(13格在2560×1440上选出2列×7行，每格又宽又扁)；
        // 目标宽高比约1.5:1，偏离越远惩罚越大。
        const tw = W / c, th = H / rows, area = tw * th, lr = Math.log(tw / th / L.GRID_ASPECT);
        const score = area * Math.exp(-lr * lr);
        if (!best || score > best.score + 1e-9) best = { cols: c, rows, area, score };
      }
    }
    if (best) return { cols: best.cols, rows: best.rows, show: n, more: 0, tileW: W / best.cols, tileH: H / best.rows };
    const cols = maxC, rows = Math.max(1, Math.floor(H / o.minH));
    const cap = (H >= o.minH ? cols * rows : 0), show = Math.max(0, Math.min(n, cap - 1));      // 高度连一行都放不下：一块都不显示，全部折进"更多"
    return { cols, rows, show, more: n - show, tileW: W / cols, tileH: H / rows };
  };

  /* ---------- 趋势墙分组：有趋势的各占一格，历史累积中的合并成一格 ---------- */
  // 趋势至少要3个点才画得出来(1~2个点连一条线都谈不上)。把"历史累积中"的指标合并成一个汇总格，
  // 不让它们各占一整格的面积(真实数据里17个指标有9个只有1~8个点)；顺序保持原顺序，不丢任何指标。
  L.groupTiles = function (tiles, minPts) {
    if (minPts == null) throw new Error('groupTiles 必须显式传入 minPts(阈值只在调用处定义一次，没有默认值可以悄悄偏离)');
    const main = [], pending = [];
    for (const t of tiles || []) ((t.tr && t.tr.n >= minPts) ? main : pending).push(t);
    return { main, pending };
  };
  L.gridCount = function (g) { return g.main.length + (g.pending.length ? 1 : 0); };

  /* ---------- 部署自检清单 ---------- */
  // 把"部署后需要你手工核对的事"变成页面里的一页：每项由数据判定。读不到服务器文件/真机排版的项明说"查不了"，不假装通过。
  // status: ok 通过 / todo 需要你做(必须带action) / wait 在累积中，不是失败 / note 留意 / unknown 这里查不了
  L.selfCheck = function (o) {
    const n = k => { const s = o.series && o.series[k]; return !s ? 0 : (s.nTotal != null ? s.nTotal : (s.pts ? s.pts.length : 0)); }, items = [];      // nTotal=文件里的真实点数(页面里为了瘦身只带了最近一段)
    const cf = n('cftc');
    items.push({ key: 'cftc156', title: 'CFTC 历史已回填', status: cf >= 100 ? 'ok' : 'todo', detail: 'cftc_mm_net 现有 ' + cf + ' 个点（来源一次返回约 156 周）', action: cf >= 100 ? '' : '部署最新版后等下一次自动更新；若仍只有1个点，说明真实抓取没带回明细，把 data/history/cftc_mm_net.json 发我' });
    const bf = ['crush', 'arrival', 'import'].map(k => [k, n(k)]), lowBf = bf.filter(x => x[1] < 8);
    items.push({ key: 'backfill', title: '开机率、到港预报、进口量的历史回填', status: lowBf.length ? 'todo' : 'ok', detail: bf.map(x => x[0] + ' ' + x[1] + '点').join('，'), action: lowBf.length ? '在 Actions → 回填历史数据，only 填 soy_import,arrival,crush_rate，只点一次；跑完把 data/history/_backfill_report.json 发我' : '' });
    const caps = ['gs', 'zl'].map(k => n(k)), maxCap = Math.max(...caps);
    items.push({ key: 'capital', title: '龙虎榜席位历史在累积', status: maxCap >= 8 ? 'ok' : 'wait', detail: '高盛、中粮各 ' + caps.join('、') + ' 个点。9月的21个交易日已用你给的大商所文件回填（高盛/瑞银是下限估计），之后每个交易日应加 1', action: '' });
    items.push({ key: 'hist-field', title: 'latest.json 里没有留下 CFTC 的 156 周明细', status: o.cftcHasHistoryField ? 'todo' : 'ok', detail: o.cftcHasHistoryField ? '最新的 latest.json 里 cftcManagedMoney 仍带 history 字段（每次多约 12KB）' : '已确认没有 history 字段', action: o.cftcHasHistoryField ? '确认已部署 v101，它会在记录后删掉这个字段' : '' });
    items.push({ key: 'scoring', title: '评分规则版本', status: o.scoring === 'v100' ? 'ok' : 'todo', detail: '当前 ' + (o.scoring || '未知') + '（期望 v100：现货基差按当前合约分位 + 供需各算净倾向再50/50合成）', action: o.scoring === 'v100' ? '' : '推送最新版后再看' });
    let sync = { status: 'unknown', detail: '没有同步时间' };
    if (o.now != null && o.latestDate != null) { const days = Math.floor((o.now - o.latestDate) / 86400000); sync = { status: days >= 3 ? 'note' : 'ok', detail: 'latest.json 距今 ' + days + ' 天' + (days >= 3 ? '（休市期间这是正常的；交易日里超过 2 天才需要查看门狗）' : '') }; }
    const pn = n('poultry'), hg = n('hog'), bs = o.basisSame || {};
    items.push({ key: 'poultry-ndrc', title: '肉鸡预期盈利（发改委×卓创）历史', status: pn >= 50 ? 'ok' : pn >= 3 ? 'wait' : 'todo', detail: 'poultry_ndrc 现有 ' + pn + ' 个周（2024-06 起）；发改委缺失/过期时 Mysteel 白羽肉鸡养殖利润顶替同一票位，票权×0.5', action: pn >= 3 ? '' : '在 Actions → 回填历史数据，only 填 poultry_ndrc' });
    items.push({ key: 'hog-ratio', title: '猪粮比历史', status: hg >= 100 ? 'ok' : hg >= 3 ? 'wait' : 'todo', detail: 'hog_ratio 现有 ' + hg + ' 个点', action: hg >= 3 ? '' : '在 Actions → 回填历史数据，only 填 hog_ratio' });
    items.push({ key: 'basis-same', title: '现货基差：当前合约内的样本', status: bs.n >= bs.min ? 'ok' : 'wait', detail: '当前主力 ' + String(bs.contract || '—').toUpperCase() + ' 已有 ' + (bs.n == null ? '—' : bs.n) + ' 个交易日（≥' + (bs.min || 20) + ' 才计分；换月后约一个月内这一票会缺席，这是有意的）', action: '' });
    items.push({ key: 'sync', title: '数据同步', ...sync, action: '' });
    items.push({ key: 'watchdog', title: '同步看门狗最近一次运行', status: 'unknown', detail: '需要读 GitHub 的工作流状态，这个页面查不了', action: '' });
    items.push({ key: 'device', title: '真机排版（手机、电脑、深浅色）', status: 'unknown', detail: '我在 Chromium 里实测过七个电脑尺寸和三个手机尺寸，但没有在你的真实设备上看过', action: '' });
    return items;
  };

  /* ---------- 趋势墙分块：供给 / 需求 / 结构与资金，各占一行(或几行) ---------- */
  L.BLOCKS = [{ key: 'supply', name: '供给', groups: ['供给'] }, { key: 'demand', name: '需求', groups: ['需求'] }, { key: 'struct', name: '结构与资金', groups: ['结构', '资金'] }];
  // tiles: 带 g(供给/需求/结构/资金) 和 tr.n 的格子。返回[{key,name,trending:[...],pending:[...]}]，空块不返回，顺序固定，不认识的分组并入最后一块(不丢)。
  L.groupByBlock = function (tiles, minPts) {
    minPts = minPts == null ? 3 : minPts;
    const out = L.BLOCKS.map(b => ({ key: b.key, name: b.name, trending: [], pending: [] }));
    for (const t of tiles || []) {
      let k = L.BLOCKS.findIndex(b => b.groups.includes(t.g));
      if (k < 0) k = out.length - 1;
      ((t.tr && t.tr.n >= minPts) ? out[k].trending : out[k].pending).push(t);
    }
    return out.filter(b => b.trending.length + b.pending.length > 0);
  };
  // 一行里 cells 个格子排 c 列：最后一个格子可以撑满该行剩余的列，返回它能跨几列(含自己)
  L.lastSpan = function (cells, c) { return cells <= 0 ? 0 : c - ((cells - 1) % c); };

  L.GRID_MIN.maxColsBlocks = 8;      // 块布局的最大列数(供给7格可以排一行)
  /* planBlocks(W,H,blocks)：blocks=[{key,trending:数量,pending:数量}]。
   * 规则：①每个可见块至少一行；②块里"趋势格+(有累积中的指标则1个汇总格)"放得下就全显示；③放不下：优先级最低(列表末尾)的趋势格并进这个块自己的汇总格，
   *      汇总格里仍显示名称/最新值/三期箭头；④连每块一行都放不下：最后几块整块并进前一个可见块的汇总格(dropped+mergeInto)；⑤不靠滚动条。
   * 在所有列数方案里：优先"全部显示"，其次"显示的趋势格最多"，再按 面积×宽高比惩罚 打分。 */
  L.planBlocks = function (W, H, blocks, o) {
    o = Object.assign({ rail: 22 }, L.GRID_MIN, o || {});
    const usable = Math.max(0, W - o.rail), R = Math.floor(H / o.minH);
    const live = blocks.map((b, i) => ({ i, key: b.key, tr: b.trending | 0, pe: b.pending | 0 })).filter(b => b.tr + b.pe > 0);
    if (R < 1 || !live.length) return { empty: true, cols: 1, rowsTotal: 0, blocks: blocks.map(b => ({ key: b.key, rows: 0, showTrend: 0, folded: 0, summary: false, dropped: true, mergeInto: null })), full: false, tileW: usable, tileH: H };

/* ---- 交易计划：规则 + 信号 + 仓位计算器 + 回测摘要（v101.25） ---- */

const TPLAN = {

  STOP: 4, TRAIL: 4, ACT: 8,          // 止损4%；移动止盈：持仓期间最高浮盈≥8% 之后，从持仓最高(低)价回落≥4% 平仓（回测验证过的等价写法）

  BT_MARGIN: .10, TON: 10             // 回测保证金10%；每手10吨

function planTier(E) { for (const [lim, u] of TPLAN.TIERS) if (E < lim) return u; return TPLAN.TIERS[TPLAN.TIERS.length - 1][1]; }

/* mode='real'：手数按你填的实际保证金算（占用=你说的资金占比）；mode='bt'：按回测的10%保证金/名义杠杆算（保证金高于10%时实际占用会更高）*/
function planSize(o) {
  const E = o.equity, m = o.margin, px = o.price, side = o.side >= 0 ? 1 : -1, u = planTier(E), den = o.mode === 'bt' ? TPLAN.BT_MARGIN : m;

/* ---- 账户与持仓（v101.26）：权益、手续费、持仓最高/最低价全部由交易记录和价格数据算出 ---- */
function planWhy(sg) {

  if (sg.shortOK) return '外资去杠杆 + 价格趋势向下';

function planDataLine(g, used, lastD, fD) {

  vp: ['量价怎么看', `<p>量价关系看最近 5 个交易日的价格变化和持仓量变化，沿用现有页面的同一套算法，不另造。</p><ul><li><b>增仓上涨</b>：新多头进场，上涨有增量资金确认，偏多。</li><li><b>增仓下跌</b>：新空头进场，下跌有增量资金确认，偏空。</li><li><b>减仓上涨</b>：更多是空头回补，上涨缺乏新资金确认，不判方向。</li><li><b>减仓下跌</b>：多头离场为主，下跌缺乏新空头，动能在衰减，不判方向。</li></ul><p>顶部那排小方块是最近 5 天，从左到右从旧到新：深红增仓上涨，深绿增仓下跌，浅红减仓上涨，浅绿减仓下跌，灰色没有明显变化。</p><p>持仓量在合约临近交割时会机械地下降，所以现有算法设了三道门槛（持仓不低于 50 万手、不低于近 120 日峰值的 60%、距合约月至少 45 天），没过就不计分。</p>`],
  fund: ['基本面怎么算', `<p>每个供需指标投一票（红偏多、绿偏空），按权重加权得到“净倾向”。净倾向进入 ±22% 的区间才算有方向，否则是“信号混合”。权重含天气开关和数据质量折扣。</p><p>市场结构（基差、月差、量价）来自价格本身，不计入这个净倾向。</p><p>这里的方向和数字取自每日系统记录的最新一天，和线上页面一致；小曲线是最近每天的记录。</p>`],
  capital: ['资金面怎么看', `<p>龙虎榜是收盘后才发布的前一日数据；固定看主力合约（净空头榜持仓合计最大的合约），不跟你选的合约走，因为非主力合约几乎没人持仓。</p><p>高盛净多 ≥ 12 万手算高位；CFTC 管理基金净多的近 156 周分位 ≥ 90 算拥挤；两者都满足是“外资多头拥挤”。高盛当日净多减少 ≥ 2 万手，优先显示“撤退预警”。数据缺失时写“数据不足”，不写中性。阈值来自参考文档，暂定，未回测。</p>`],
  price: ['图怎么看', `<p>红涨绿跌的 K 线，细线是 20 日均线，虚线是最近 20 个交易日的最高和最低。图下方金色的线是持仓量。</p><p>“最近 20 个交易日的高低之间”这条带：把近 20 天的最低价当作 0%，最高价当作 100%，今天的收盘价落在中间哪个位置。越靠右越贴近近期高点，越靠左越贴近近期低点。</p>`],

};
ABOUT.price[1] += `<p><b>紫色虚线 = 盈亏平衡价</b>：用豆二、豆油盘面价和压榨费150元算出来的“油厂压榨不亏的豆粕价”。盘面在它上方，油厂有利润；跌到它下方，油厂亏损，会减产，所以它常被当作底部参照。它不是买卖信号，盘面可以长期低于它。</p>`;
ABOUT.pos = ['价格位置怎么看', `<p>阴影带是每一天往回看 260 个交易日的 <b>20%～80% 分位价</b>：下沿“铁底”（有 20% 的日子比它便宜），上沿“铁顶”（80% 的日子比它便宜）。<b>它们不是历史最高/最低价</b>，会随最近一年的价格走，价格涨起来铁顶也会跟着抬。</p><p>线的颜色：青=在铁底以下，橙=在铁顶以上，灰=中间。下面两条横带是现价在近260日、近10年里的百分位。</p><p>历史检验：低位带之后表现略好于基准，只是温和支持；高位带之后<b>没有“会跌”的证据</b>。它只说明现在贵不贵，不是买卖信号。价格用主力连续价，换月缺口没修正。</p>`];
ABOUT.sea = ['同期规律怎么看', `<p>每根柱子是该月份在历年里“上涨的年份占比”。默认看现货价格，可切到期货（换月修正后的月度涨跌）。下方数字是历年平均涨跌。</p><p>稳定性分三档：前后两半样本方向相反=不稳；同向但胜率或显著性不够=一般；同向且胜率、显著性都够=较稳。柱子越淡越不稳。</p><p>季节性只描述“历史上通常怎样”，不预测今年，样本只有9~10年。</p>`];
ABOUT.cost = ['成本锚怎么看', `<p>所有数字都是<b>豆粕价格（元/吨）</b>：豆的成本按出粕率78.5%，扣掉豆油副产品（出油率18.5%）和压榨费150元换算而来。</p><ul><li><b>盈亏平衡价</b>：只用豆二、豆油盘面价算，最可靠。盘面高于它=压榨有利润；低于它=亏损、油厂减产，下方有支撑。</li><li><b>进口成本带</b>：用CBOT大豆+升贴水（±50美分）+关税+增值税9%+港杂100元推算。美豆关税13%，成本偏高，说明盘面是按更便宜的巴西豆定价的。</li><li>升贴水是4月快照，没有历史、无法回测；增值税、港杂是经验值未核实，所以进口成本带只当参考。</li></ul><p>成本锚是估值参照，<b>不是买卖信号</b>。</p>`];
ABOUT.plan = ['交易计划怎么用', `<p>页面分「交易」和「研究」两个模式（右上角切换，记住你的选择）：交易模式只留入场信号、持仓管理、账户权益、交易记录和K线；基本面趋势墙、市场状态、成本锚、证据页在研究模式。顶部「入场信号」和「持仓管理」两格就是结论。<b>系统不会替你下单</b>，它只做三件事：告诉你今天有没有入场信号、该开几手；你成交后记一笔，之后开仓价、持仓最高/最低价、浮盈亏、权益全部自动算；每天自动判定持仓该走还是继续拿。</p>
<ul><li><b>做多</b>：价格在近260日 ≤50% 分位，今天的收盘高于5日前、且比前10日最低价高1%以上，外资5日净变化 > −2万手。</li>
<li><b>做空</b>：只有外资去杠杆（5日净变化 ≤ −2万手）且价格 < MA20 < MA60、低于5日前才做。</li>
<li><b>平仓</b>：亏4%止损；持仓期间最高浮盈到过 ≥8% 之后，从最高（空单最低）价回落4% 平；持多单遇外资去杠杆平多；空单遇外资5日净变化 ≥0 或价格站上MA20 离场。</li>
<li><b>占用阶梯</b>：权益<500万 60%；500~1500万 40%；1500~5000万 25%；其后 15%（页面底部可展开）。没有账户回撤熔断。</li></ul>
<p><b>权益怎么算</b>：初始资金 + 出入金 + 已平仓盈亏 + 持仓浮动盈亏 − 手续费。要追加资金（比如每年加20万）就记一笔入金；和期货公司账户对不上时用「按实际权益校准」，系统会记一笔差额。</p>
<p><b>最高/最低价怎么来</b>：用主力连续日线收盘价，从你的开仓日取到最新一天，和回测同口径（盘中最高价不计）。你的开仓价和主连差超过2%时按开仓日折算。信号和离场判断都只在收盘后看一次。</p>
<p><b>手续费</b>：按「每手来回多少元」估算，开仓/平仓各一半；回测用 23 元（含滑点估计），63、103 元是敏感性。记录时填了实际金额就用实际的。</p>
<p><b>保证金比例</b>：回测按10%。填期货公司实际比例后，「按我的实际保证金占用」按它算手数；「按回测杠杆」手数不变，实际占用会更高、风险度更接近追保线。风险度到100%的价格是追保/强平的大致位置，以你的期货公司为准。</p>
<p><b>移动止盈为什么是「最高浮盈 ≥8% 后回落4%」</b>：按「最高浮盈到过4%就开始跟踪」回测，反而更差——小利润的单子被早早洗出；「≥8%后回落4%」和原先回测的写法等价。回落幅度不要收紧。</p>
<p><b>数据不足时</b>：外资5日数据一个席位都没取到、或价格数据超过7天没更新，信号格会显示「数据不足，信号不可信」，不给开仓建议（回测里缺外资数据按0算，等于去杠杆过滤失效）。</p>
<p><b>决策快照</b>：每次记开仓/平仓，会同时存下当时的基本面方向、技术面、资金面、市场状态和信号条件；交易记录里能看到开仓时的基本面和外资，「导出CSV」带全部快照字段。基本面目前没有被回测证明有用（见项目文档），快照是为了以后用你自己的实盘去检验它。</p>
<p><b>记录存在哪</b>：只存在这台设备的浏览器里，换设备或清缓存会丢，所以页面底部有「备份下载 / 恢复备份」。</p>
<p><b>局限</b>：39笔交易、样本内；外资信号只有2022年以后；不含涨跌停无法成交、大资金冲击成本和持仓限额。</p>`];

  const keys = ['regime', 'vp', 'fund', 'capital', 'price', 'wall'], order = k ? [k, ...keys.filter(x => x !== k)] : keys;
  const extra = `<h3>合约自动切换</h3><p>按你定的建议交易窗口自动选：9月合约 4–7月，1月合约 8–11月，5月合约 12–3月，全年没有空档。点头部的合约标签可以手动看别的合约；每日记录仍然记三个合约，不受影响。</p><h3>主题</h3><p>默认按本地时间自动切换：06:30 到 18:30 是日间，其余是夜间。点“主题”可以固定成日间、夜间或回到自动。</p><h3>数据口径提醒</h3><ul><li>豆菜粕价差 2026-06 起换成三城市单值，旧阈值不适用，新口径暂不计分。</li><li>开机率历史不足时回退固定阈值。</li><li>国储拍卖、能繁母猪只展示，不计分。</li></ul>`;
  openSheet('说明：怎么读这页', order.map(x => `<h3 style="font-size:15px">${ABOUT[x][0]}</h3>${ABOUT[x][1]}`).join('') + extra);
}

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  function runUI() {
    var s = document.createElement('script'); s.textContent = $('uiSrc').textContent; document.body.appendChild(s);
    var b = $('boot'); if (b) b.remove();
  }
  function warn(fails) {
    var old = document.querySelector('.bootwarn'); if (old) old.remove();
    if (!fails || !fails.length) return;
    var d = document.createElement('div'); d.className = 'bootwarn';
    d.innerHTML = '<span>部分数据文件没取到（不影响其他部分）：' + fails.map(function (x) { return String(x).replace(/[<&]/g, ''); }).join('、') + '</span><button type="button">知道了</button>';
    d.querySelector('button').onclick = function () { d.remove(); };
    document.body.appendChild(d);
  }
  function status(msg, fails, err) {
    if (msg === 'error') {
      var first = !window.__DATA__;
      if (first) {
        $('bootSp').style.display = 'none'; $('bootT').textContent = '没能启动';
        $('bootM').textContent = '评分引擎或数据没有读到。';
        $('bootX').innerHTML = '<button type="button" id="bootRetry">重试</button><a href="engine.html">打开旧版完整页面</a><pre></pre>';
        $('bootX').querySelector('pre').textContent = String(err && err.message || err);
        $('bootRetry').onclick = function () { location.reload(); };
      } else warn(fails);
      return;
    }
    if (msg && $('bootM')) $('bootM').textContent = msg;
    warn(fails);
  }
  if (location.protocol === 'file:') {
    $('bootSp').style.display = 'none'; $('bootT').textContent = '需要通过网址打开';
    $('bootM').textContent = '驾驶舱要在后台运行评分引擎并读取 data/ 下的数据，浏览器不允许 file:// 方式这样做。请用 GitHub Pages 的网址打开，或在项目目录运行 python3 -m http.server 后访问 http://localhost:8000/。';
    $('bootX').innerHTML = '<a href="engine.html">直接打开旧版完整页面</a>';
    return;
  }
  window.CockpitData.boot({ STATIC: window.__STATIC__, runUI: runUI, status: status });
})();
</script>
